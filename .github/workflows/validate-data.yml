name: Validate structured data

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: Validate route records
        run: npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s database/schemas/route.schema.json -d 'database/json/routes/*.json'
      - name: Validate Master v1 API export
        run: npx --yes ajv-cli@5.0.0 validate --spec=draft2020 -s database/schemas/master-api.schema.json -d database/generated/routes_v1.json
