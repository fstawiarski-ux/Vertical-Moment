name: Validate structured data

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate route records
        run: npx --yes ajv-cli@5 validate --spec=draft2020 -s database/schemas/route.schema.json -d 'database/json/routes/*.json'
