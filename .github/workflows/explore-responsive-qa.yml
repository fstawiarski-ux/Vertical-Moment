name: Explore responsive visual QA

on:
  pull_request:
    paths:
      - "website/app/explore-app/**"
      - "website/src/**"
      - "website/scripts/qa-hero-first-review.mjs"
      - ".github/workflows/explore-responsive-qa.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  responsive-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install application dependencies
        run: npm ci

      - name: Install pinned Playwright harness
        run: npm install --no-save --package-lock=false playwright@1.61.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Complete production and PWA build
        run: npm run build

      - name: Start production server
        run: |
          npm start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/vertical-moment-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vertical-moment-next.pid"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error "http://127.0.0.1:3000/explore-app?intro=skip" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/vertical-moment-next.log"
          exit 1

      - name: Run Hero-First responsive contract
        env:
          VM_PREVIEW_URL: "http://127.0.0.1:3000/explore-app?intro=skip"
        run: node scripts/qa-hero-first-review.mjs

      - name: Preserve server log
        if: always()
        run: |
          mkdir -p review-artifacts/hero-first
          cp "$RUNNER_TEMP/vertical-moment-next.log" review-artifacts/hero-first/server.log || true

      - name: Upload responsive QA evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: explore-responsive-hero-first-${{ github.sha }}
          path: website/review-artifacts/hero-first/
          if-no-files-found: error
          retention-days: 14
