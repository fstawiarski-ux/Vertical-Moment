name: Deploy website to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "database/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: cloudflare-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test production pages
        shell: bash
        run: |
          set -euo pipefail
          for path in / /climbers-lounge /prints/panoramas; do
            url="https://verticalmoment.com${path}"
            echo "Checking ${url}"
            curl \
              --fail \
              --show-error \
              --silent \
              --location \
              --retry 10 \
              --retry-all-errors \
              --retry-delay 5 \
              --retry-max-time 90 \
              --max-time 20 \
              "${url}" \
              --output /dev/null
          done
