name: Test website

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "database/**"
      - ".github/workflows/test.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        # No lfs: the unit tests never touch the scrub media.

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # public/data/v1/*.json is generated, not committed. The build gets it via
      # the prebuild hook; a typecheck that never builds has to ask for it.
      - name: Sync data
        run: npm run sync-data

      - name: Verify data mirror
        run: npm run verify-data

      - name: Verify public security boundaries
        run: npm run verify-security

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test
