name: Route data update
description: Add or correct a route record from an authoritative source.
title: "route: "
labels: ["data", "route"]
body:
  - type: input
    id: area
    attributes: {label: Area, placeholder: "Höllental"}
  - type: input
    id: sector
    attributes: {label: Sector}
  - type: textarea
    id: source
    attributes: {label: Source evidence, description: "Guidebook page, survey, photo ID, or verified local source."}
  - type: textarea
    id: change
    attributes: {label: Proposed route data}
    validations: {required: true}
