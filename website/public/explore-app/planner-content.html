<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F1F4F3; --card:#FFFFFF; --ink:#18212B; --muted:#586573; --line:#D3DAD9; --soft:#E7ECEB;
  --nav:#1F2A37; --navink:#DCE4EA; --navmute:#93A1AE;
  --link:#1A57B5; --tierA:#F9A66C; --tierAink:#5A2A06; --tierB:#A5D8FF; --tierBink:#0B3556; --tierC:#E1E6E5; --tierCink:#43505C;
  --ok:#2F7D4F; --okbg:#DDF0E4; --warnbg:#FFE7C7; --warnink:#7A3F00; --focus:#1A57B5;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --head:'Archivo','Arial Narrow',system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181F; --card:#1A222B; --ink:#E6ECEF; --muted:#9DABB7; --line:#2E3946; --soft:#232D38;
    --nav:#0D1319; --link:#7DB2FF; --tierAink:#FFD9BD; --tierBink:#CDE9FF; --tierCink:#B8C3CC;
    --tierA:#8A4A1F; --tierB:#1F4E73; --tierC:#2B3641; --okbg:#1E3B2A; --ok:#7FD09C; --warnbg:#4A3413; --warnink:#FFCE8A; --focus:#7DB2FF;
  }
}
:root[data-theme="dark"]{
  --paper:#12181F; --card:#1A222B; --ink:#E6ECEF; --muted:#9DABB7; --line:#2E3946; --soft:#232D38;
  --nav:#0D1319; --link:#7DB2FF; --tierAink:#FFD9BD; --tierBink:#CDE9FF; --tierCink:#B8C3CC;
  --tierA:#8A4A1F; --tierB:#1F4E73; --tierC:#2B3641; --okbg:#1E3B2A; --ok:#7FD09C; --warnbg:#4A3413; --warnink:#FFCE8A; --focus:#7DB2FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--link)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
nav.rail{background:var(--nav);color:var(--navink);padding:20px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto}
.brand{padding:0 20px 16px;font:800 19px/1.15 var(--head);letter-spacing:.01em}
.brand small{display:block;margin-top:4px;font:500 12px/1.3 var(--sans);color:var(--navmute)}
.grp{margin:14px 0 4px;padding:0 20px;font:600 12px var(--sans);color:var(--navmute)}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:var(--navink);padding:8px 20px 8px 16px;cursor:pointer}
.tab i{width:10px;height:10px;border-radius:2px;flex:none}
.tab:hover{background:rgba(255,255,255,.07)}
.tab[aria-current="page"]{background:rgba(255,255,255,.12);font-weight:600;border-left-color:var(--c)}
.railfoot{padding:16px 20px 0;font-size:12px;color:var(--navmute)}
.railfoot button{margin-top:8px;background:none;border:1px solid #4A5866;color:var(--navink);border-radius:6px;padding:5px 10px;cursor:pointer;margin-right:6px}
main{padding:28px clamp(16px,3vw,40px) 64px;min-width:0}
h1{font:800 clamp(26px,3.4vw,38px)/1.08 var(--head);margin:0 0 6px;letter-spacing:-.005em}
h2{font:700 20px/1.2 var(--head);margin:28px 0 10px}
.sub{color:var(--muted);max-width:78ch;margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:14px 0}
.bar input[type=search],.bar select,.bar input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.bar input[type=search]{flex:1 1 220px;min-width:0}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:38px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--nav);color:#fff;font:600 13px var(--sans);white-space:nowrap;position:relative}
th.sort{cursor:pointer;text-decoration:underline dotted;text-underline-offset:5px}
td a{overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center}
.chip{display:inline-block;min-width:26px;text-align:center;padding:1px 8px;border-radius:5px;font:700 13px var(--head)}
.chip.A{background:var(--tierA);color:var(--tierAink)}.chip.B{background:var(--tierB);color:var(--tierBink)}.chip.C,.chip.x{background:var(--tierC);color:var(--tierCink)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--soft);font-size:12px;color:var(--muted)}
.tag.on{background:var(--okbg);color:var(--ok)}
.past td{opacity:.5}
.due td:first-child{box-shadow:inset 4px 0 0 var(--tierA)}
.due{background:var(--warnbg)}
.ev b{font-weight:600}.ev .where{color:var(--muted);font-size:13px}
.mini{font-size:13px;color:var(--muted)}
.det td{background:var(--soft);font-size:14px}
.det dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.det dt{color:var(--muted)}.det dd{margin:0}
.exp{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:13px}
select.st,input.st{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-height:34px;max-width:100%}
select.st.set{background:var(--okbg);border-color:var(--ok)}
input.st.narrow{width:90px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}.stat b{font:800 18px var(--head)}
.board{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.board li{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.board li:last-child{border:0}
.days{font:800 30px/1 var(--head);text-align:center}.days small{display:block;font:500 12px var(--sans);color:var(--muted);margin-top:2px}
.board .t{font-weight:600}.board .m{color:var(--muted);font-size:13px}
.steps a.tablink{font-weight:600}
.notes li{margin:5px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:8px 14px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--nav);color:#fff;font-weight:600}
.mhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.mhead h2{margin:0 8px 0 0;font-size:22px}
.mhead button{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:38px;min-width:38px;padding:0 12px;cursor:pointer}
.mhead button:disabled{opacity:.4;cursor:default}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mg .dow{background:var(--nav);color:#fff;font:600 13px var(--sans);padding:8px 6px;text-align:center}
.mg .day{background:var(--card);border:0;text-align:left;min-height:108px;padding:5px 5px 6px;cursor:pointer;display:block;min-width:0}
.mg .day:hover{background:var(--soft)}
.mg .day.out{opacity:.45}
.mg .day.sel{outline:2px solid var(--focus);outline-offset:-2px}
.mg .num{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;font:700 13px var(--head)}
.mg .day.today .num{background:var(--nav);color:#fff}
.mchip{display:block;margin-top:3px;padding:1px 6px;border-radius:4px;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.A{background:var(--tierA);color:var(--tierAink)}.mchip.B{background:var(--tierB);color:var(--tierBink)}.mchip.C{background:var(--tierC);color:var(--tierCink)}
.mchip.fin{opacity:.5}
.more{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.dayp{margin-top:16px}
.dayp .ev2{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.dayp .ev2 .sels{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:900px){
  .app{display:block}
  nav.rail{position:sticky;height:auto;padding:8px 0;z-index:5;overflow:visible}
  .brand,.grp,.railfoot{display:none}
  .tabs{display:flex;overflow-x:auto;gap:2px;padding:0 8px;scrollbar-width:thin}
  .tab{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:8px 10px;border-radius:6px 6px 0 0}
  .tab[aria-current="page"]{border-bottom-color:var(--c)}
  main{padding-top:18px}
}
@media (max-width:720px){
  .wrap{border:0;background:none;overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 0}
  td{border:0;padding:5px 14px}
  td::before{content:attr(data-l);display:block;color:var(--muted);font-size:12px}
  td.nolabel{display:block}td.nolabel::before{display:none}
  td.num{text-align:left}
  .det td{display:block}
  .mg .day{min-height:58px;padding:3px}
  .mg .dow{font-size:11px;padding:6px 2px}
  .mchip{font-size:0;height:6px;padding:0;margin-top:3px}
  .more{font-size:10px}
  .board li{grid-template-columns:60px 1fr}.board li>span:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

irol","category":"Regional partner","url":"https://www.climbers-paradise.com/en/imprint/","contact":"Official contact / imprint","note":"Use official regional contact.","action":"Offer a specific place + people photo story after completing a local example.","evidence":"Official imprint checked"}],"events":[{"date":"2026-10-02","label":"2–4 Oct 2026","name":"Rock Master","place":"Arco","priority":"Optional travel","action":"Jessica Pilz and Adam Ondra are on the published roster. Jakob is not on that roster. Meet-and-greets are advertised; a shoot is not arranged.","url":"https://rockmaster.com/en/rock-master/athletes","calendarId":111},{"date":"2026-10-03","label":"3 Oct · 11:00–16:00","name":"Vienna Boulder Tour","place":"Klosterneuburg","priority":"First local option","action":"Ask venue now. If photo access cannot be arranged, attend to meet people or choose the next stop.","url":"https://www.viennabouldertour.at/","calendarId":8},{"date":"2026-10-17","label":"17 Oct · 11:00–16:00","name":"Vienna Boulder Tour","place":"Blockfabrik","priority":"Best preparation window","action":"More time to agree a small coverage brief and gallery delivery.","url":"https://www.viennabouldertour.at/","calendarId":29},{"date":"2026-10-23","label":"23 Oct 2026","name":"Festival program release","place":"Salzburg / online","priority":"Review date","action":"Choose one film discussion or talk when program and ticket sales open.","url":"https://www.daskino.at/festivals/32-bergfilmfestival-2026"},{"date":"2026-11-07","label":"7 Nov · 11:00–16:00","name":"Vienna Boulder Tour","place":"Boulder Monkeys","priority":"Local follow-through","action":"Continue relationships from October.","url":"https://www.viennabouldertour.at/","calendarId":53},{"date":"2026-11-11","label":"11–22 Nov 2026","name":"Bergfilmfestival","place":"Salzburg","priority":"Optional travel","action":"Useful for photographers and documentary contacts.","url":"https://www.daskino.at/festivals/32-bergfilmfestival-2026","calendarId":112},{"date":"2026-11-14","label":"14 Nov · 11:00–16:00","name":"Vienna Boulder Tour","place":"Boulderbar Seestadt","priority":"Local follow-through","action":"Ask host for a defined brief.","url":"https://www.viennabouldertour.at/","calendarId":68},{"date":"2026-11-21","label":"21–22 Nov 2026","name":"Alpinmesse","place":"Innsbruck","priority":"Brands / peers","action":"Plan specific conversations before travel; ask media conditions.","url":"https://www.alpinmesse.info/de/besuchen/oeffnungszeiten-preise","calendarId":113},{"date":"2026-11-28","label":"28 Nov · 11:00–16:00","name":"Vienna Boulder Tour","place":"Edelweiss Floridsdorf","priority":"Local follow-through","action":"Ask for a referral after delivering an earlier set.","url":"https://www.viennabouldertour.at/","calendarId":92},{"date":"2026-12-12","label":"12 Dec 2026","name":"Vienna Boulder Tour final","place":"das flash","priority":"Season close","action":"Time details still to follow on official page.","url":"https://www.viennabouldertour.at/","calendarId":101},{"date":"2027-06-07","label":"7–13 Jun 2027","name":"World Climbing Series","place":"Innsbruck","priority":"Longer-term","action":"Dates confirmed. Media page still describes 2026: recheck 2027 application process.","url":"https://www.worldclimbingseries.com/","calendarId":109},{"date":"2027-08-13","label":"13–21 Aug 2027","name":"World Climbing Championship","place":"Brno","priority":"Longer-term","action":"Dates confirmed; watch for media requirements.","url":"https://www.brno2027.com/","calendarId":110}],"drafts":[{"title":"Klosterneuburg · event enquiry · German","subject":"Vienna Boulder Tour am 3. Oktober – Anfrage zur fotografischen Begleitung","body":"Hallo liebes Team,\n\nich bin Filip Stawiarski, Kletterer und Fotograf aus Wien, und arbeite an meinem Dokumentarfotografie-Projekt Vertical Moment.\n\nIch habe gesehen, dass die Vienna Boulder Tour am 3. Oktober bei euch stattfindet. Gibt es noch die Möglichkeit, nach Absprache eine kleine Fotostrecke vor Ort zu machen? Falls bereits jemand die Veranstaltung fotografiert, würde ich mich gern nach eurem bestehenden Ablauf richten.\n\nMein Vorschlag wäre ein klar abgegrenzter Zeitraum mit Actionbildern, Details und einigen Porträts. Umfang, Liefertermin und die Nutzung für euren Veranstaltungsrückblick würde ich gern vorher mit euch abstimmen.\n\nEine kurze Auswahl meiner bisherigen Kletterfotos findet ihr hier: [funktionierender Portfolio-Link].\n\nWer wäre dafür die richtige Ansprechperson? Falls es für Samstag zu kurzfristig ist, freue ich mich auch über eine Gelegenheit bei einer späteren Session.\n\nLiebe Grüße\nFilip Stawiarski\nVertical Moment · Wien\nf.stawiarski@gmail.com"},{"title":"Jessica Pilz · direct photo proposal · English","subject":"A documentary climbing-photo session — Vertical Moment","body":"Hi Jessica,\n\nI’m Filip Stawiarski, a Vienna-based climber and documentary photographer behind Vertical Moment. I photograph climbing around Vienna, the Wachau and the Eastern Alps.\n\nI’d love to propose a small photo story around one climbing session: the preparation, the attempts and a few portraits, shaped around a project or location you would actually like to photograph.\n\nFor a first portfolio collaboration, I would be happy to offer the session without a fee. We would agree the time, edited image selection, delivery date and permitted use before the shoot. The aim would be useful photographs for your own channels and an agreed story for my portfolio.\n\nHere is a short selection of my work: [working portfolio link].\n\nWould this interest you, and is this the right address for photo proposals? I can travel to Innsbruck if we find a suitable time.\n\nBest,\nFilip Stawiarski\nVertical Moment · Vienna\nf.stawiarski@gmail.com\n\n[Keep the Innsbruck sentence only if you are willing to travel.]"},{"title":"Jakob Schubert · management proposal · English","subject":"Documentary photo proposal for Jakob — Vertical Moment","body":"Hello Florian,\n\nI’m Filip Stawiarski, a Vienna-based climber and photographer behind Vertical Moment.\n\nI’d like to propose a small documentary session with Jakob around the process behind a climbing attempt: preparation, decisions between tries, action and portraits. I would work around a setting and time that suit him.\n\nFor a first portfolio collaboration, I would be happy to offer the session without a fee. We would agree the scope, delivery, athlete approvals and intended image use in advance, with any sponsor use discussed separately.\n\nRelevant work: [working portfolio link].\nPossible timing: [two realistic windows / travel availability].\n\nWould this be relevant to Jakob, and are you the right person to discuss it with?\n\nBest,\nFilip Stawiarski\nVertical Moment · Vienna\nf.stawiarski@gmail.com\n\n[Check any earlier contact with Jakob’s team before sending. Use a reply to the existing conversation if there is one.]"},{"title":"Kletterverband Wien · introduction · German","subject":"Kletterfotografie in Wien – Anfrage nach einer passenden Zusammenarbeit","body":"Hallo liebes Team,\n\nich bin Filip Stawiarski, Kletterer und Fotograf aus Wien. Mit Vertical Moment dokumentiere ich Klettern in Wien, der Wachau und den Ostalpen.\n\nIch suche eine erwachsene Kletterin, einen erwachsenen Kletterer oder einen Coach, die oder der Interesse an einer kleinen gemeinsamen Fotostrecke hätte: eine echte Trainingseinheit oder ein Felsprojekt, ergänzt durch Porträts und Details.\n\nHier ist eine kurze Auswahl meiner Arbeit: [funktionierender Portfolio-Link]. Für eine erste Portfolio-Zusammenarbeit würde ich die Session ohne Honorar anbieten; Ablauf, Bildauswahl, Lieferung und Veröffentlichung würden wir gemeinsam abstimmen.\n\nWäre euch jemand eingefallen, für den so eine Zusammenarbeit sinnvoll wäre, oder gibt es eine passende Veranstaltung, bei der ich mich vorstellen könnte?\n\nVielen Dank und liebe Grüße\nFilip Stawiarski\nVertical Moment · Wien\nf.stawiarski@gmail.com"},{"title":"Follow-up · English","subject":"Re: [original subject]","body":"Hi [Name],\n\nA quick follow-up on the photo idea below. I’d still be glad to work around [specific session / location] if it would be useful to you.\n\nHere is the short portfolio selection again: [link]. If another person coordinates these requests, I’d appreciate being pointed in the right direction.\n\nBest,\nFilip"},{"title":"Shoot confirmation · English","subject":"Confirming our photo session — [date]","body":"Hi [Name],\n\nThanks — here is the session we discussed:\n\nWhen and where: [date, time, location]\nDuration / activity: [agreed session]\nDelivery: [image count and actual dates you can meet]\nYour image use: [agreed channels and credit]\nMy portfolio use: [approved images, names / location details, and publication timing]\nAny sponsor or other third-party use: [agree separately if relevant]\nVenue / event arrangements: [confirmed access and contact person]\n\nPlease let me know if anything needs changing, or if there are details you prefer to keep private.\n\nBest,\nFilip"},{"title":"Editorial · one-image story · English","subject":"Photo-story pitch: a climbing attempt in the Wachau","body":"Hello [Editor],\n\nI’m Filip Stawiarski, a Vienna-based climber and photographer behind Vertical Moment.\n\nI’d like to pitch a short story around one photograph from [actual session / place]: [two sentences explaining the moment and why it matters to your readers].\n\nI can provide the selected photograph, its technical and personal backstory, and accurate captions. [State the publication permission you actually have.] A short edit is here: [link].\n\nWould this fit your “How I Got the Shot” section, or would another format suit you better?\n\nBest,\nFilip\n\n[For Vertical Life only; verify the current pitching address on its contributor page.]"}],"actions":[["portfolio","Select 10–12 photographs","Action, portrait, detail, environment and one sequence from a real session. Use images you can show."],["link","Make the portfolio easy to open","Test one private gallery / PDF link on a phone while signed out. The public site returned 503 during this check."],["offer","Choose your actual offer","One session without a fee, if you still want that. Agree count, dates and use individually."],["kloster","Ask Klosterneuburg about Saturday","3 October is close. An enquiry today is useful; photo access remains unarranged."],["block","Prepare the 17 October approach","Blockfabrik offers more preparation time if Saturday is too soon."],["athlete","Pick one athlete approach","Jessica has a published direct route; Jakob has management / press routes; Johanna needs verification."],["track","Check what you have already sent","The recovered plan does not establish prior replies or sent messages. Record them before starting."],["story","Book one real session","Success for the next month: one session, one delivered gallery, one approved story and one introduction."]],"workingPlan":"# Vertical Moment — Climbing Photography Outreach\nRecovered 27 September discussion • Updated 30 September 2026 • Filip Stawiarski, Vienna\n\n## What the recovered conversation establishes\nChat: **Expand climbing photography outreach**, 27 September 2026.\nYou supplied “Austria Climbing Photography — Outreach Plan” and asked to expand future shoots, events, people, contacts and drafts.\nThe record contains this request and the assistant’s expanded document. It contains no subsequent acceptance of the proposed delivery terms, no confirmed bookings and no evidence that these drafts were sent.\n\nYour original offer was a free collaboration, 15–20 edited images in 48 hours, and unrestricted use. The assistant recommended changing that to a 60–90 minute session, three previews in 48 hours, 8–12 edited images in seven days, and defined personal-channel use with commercial use discussed separately.\n**Those changes were recommendations, not settled commitments.** Choose deliverables you want and can meet for each collaboration.\nThe original expanded document is preserved separately as September-27-Original-Plan.md.\n\n## What I recommend now\nAim for one completed collaboration and an approved story in October. Run two approaches in parallel: a nearby climber / gym introduction and one carefully chosen professional athlete.\nThere is no need to wait 90 days to write to an athlete if your existing photographs already show the work you want to offer. The local work makes introductions and repeat shoots easier.\n\n### Make the work visible\n- Select 10–12 photographs: action, portrait, detail, environment, and a sequence that tells a story.\n- Create a short athlete edit and a separate event / community edit from existing work. Each should take less than a minute to browse.\n- Use one dependable private gallery or a short PDF. Test its link on a phone, signed out. The public verticalmoment.com address returned HTTP 503 in this research check; that does not establish what every visitor sees.\n- Put your name, Vienna base, documentary climbing focus and contact on the opening page.\n- Lead with a specific useful idea: “a session around one outdoor project” or “a small recap of your event.” Explain the free first-session offer after the idea.\n- After a shoot, agree a small public edit and credit with the subject. Suggest a joint post if they want one. Ask for one introduction when the gallery has been delivered.\n- Keep one clear contact link on the portfolio. Use the same photo selection and name in messages and public profiles.\nThese are practical recommendations; no profile changes or publishing are included in this update.\n\n## The next seven days\n1. **Select 10–12 photographs:** Action, portrait, detail, environment and one sequence from a real session. Use images you can show.\n2. **Make the portfolio easy to open:** Test one private gallery / PDF link on a phone while signed out. The public site returned 503 during this check.\n3. **Choose your actual offer:** One session without a fee, if you still want that. Agree count, dates and use individually.\n4. **Ask Klosterneuburg about Saturday:** 3 October is close. An enquiry today is useful; photo access remains unarranged.\n5. **Prepare the 17 October approach:** Blockfabrik offers more preparation time if Saturday is too soon.\n6. **Pick one athlete approach:** Jessica has a published direct route; Jakob has management / press routes; Johanna needs verification.\n7. **Check what you have already sent:** The recovered plan does not establish prior replies or sent messages. Record them before starting.\n8. **Book one real session:** Success for the next month: one session, one delivered gallery, one approved story and one introduction.\n\nSuggested sequence:\n30 September–1 October: select portfolio, check prior messages, ask Klosterneuburg about Saturday.\n2–4 October: attend one realistic opportunity. Default recommendation: Klosterneuburg; choose Arco if you already want and can arrange that trip.\n5–7 October: approach one athlete and Kletterverband Wien; develop the Blockfabrik brief.\nFollow up on ordinary cold outreach after roughly seven business days. For Saturday’s logistics, one short venue call before the event can be useful. Do not treat silence as permission.\nThe earlier “three contacts per week” rule was a pacing suggestion. Quality and your ability to deliver determine the right volume.\n\n## Prioritised contact list\nContact route checked means a public route was found, not that someone will reply or has agreed.\n### Kletteranlage Klosterneuburg — Now\n- Type: Gym / event\n- Public route: info@kletteranlage-klosterneuburg.at — [source](https://www.kletteranlage-klosterneuburg.at/)\n- Context: Official venue regulations publish this address; recheck the venue contact page.\n- Next action: Ask about a small authorised photo set for 3 October, 11:00–16:00. If too late, ask for a quieter adult session.\n- Evidence: VBT host confirmed; photography access not arranged\n\n### Blockfabrik — Now\n- Type: Gym / event\n- Public route: empfang@blockfabrik.at — [source](https://www.blockfabrik.at/kontakt)\n- Context: General enquiries; office@blockfabrik.at is listed for management.\n- Next action: Ask who coordinates photography for 17 October; offer an agreed recap set.\n- Evidence: Contact route and tour date checked\n\n### Kletterverband Wien — Now\n- Type: Introductions\n- Public route: Official contact page / +43 699 11730324 — [source](https://wien.austriaclimbing.com/home/kontakt.html)\n- Context: Email is obscured in page text; use the site rather than guessing it.\n- Next action: Request an introduction to an adult climber or coach interested in a documentary session.\n- Evidence: Contact page checked; no introduction arranged\n\n### One adult climber you already know — Now\n- Type: Athlete\n- Public route: Existing personal connection\n- Context: Pick someone who wants photographs and can meet locally.\n- Next action: Propose a short session around one route, training goal or climbing partnership.\n- Evidence: You choose the person; no prior outreach status known\n\n### Johanna Ernst — Verify\n- Type: Athlete\n- Public route: Verify athlete’s own current channel — [source](https://johanna-ernst.at/)\n- Context: Website could not be retrieved. Current location/contact unconfirmed; namesakes exist.\n- Next action: Verify identity and contact first; ask whether a Vienna / Wachau session would fit.\n- Evidence: Prior lead; contact needs verification\n\n### Jessica Pilz — Next\n- Type: Athlete\n- Public route: jessicapilz@gmx.at — [source](https://www.jessicapilz.at/)\n- Context: Published on her own site, whose visible news is from 2021. Confirm this is still preferred. Federation lists Innsbruck.\n- Next action: Send one concept; ask whether she handles photo proposals directly. MN2S is an alternative booking route, not proof of exclusive management.\n- Evidence: Public contact found; current routing unconfirmed\n\n### Kilian Fischhuber — Next\n- Type: Athlete / storyteller\n- Public route: info@kilian-fischhuber.at — [source](https://www.kilian-fischhuber.at/)\n- Context: His official site invites all enquiries here.\n- Next action: Pitch a portrait + rock session or a coaching / storytelling feature, subject to interest.\n- Evidence: Official inquiry route checked\n\n### Jakob Schubert — Next\n- Type: Athlete / management\n- Public route: Official INQUIRIES section — [source](https://www.link.jakob-schubert.com/)\n- Context: Business: NODUM / Florian Klingler. Press: Strobl / Katrin Strobl. Extracted email text includes bdmail; do not reconstruct it.\n- Next action: Use management for a collaboration proposal; use press only for an actual editorial request. Check prior contact before writing again.\n- Evidence: Official roles checked; actual email routing needs manual verification\n\n### NODUM Sports — Later\n- Type: Athlete management\n- Public route: Official site / linked athlete pages — [source](https://www.nodum-sports.com/)\n- Context: Site lists Janja Garnbret, Jakob Schubert and Angelino Zeller; contact text includes bdmail.\n- Next action: One tailored proposal for one athlete; avoid duplicate approaches to Jakob and the agency.\n- Evidence: Roster checked; contact routing needs verification\n\n### Salzburg Bergfilmfestival — Later\n- Type: Film / photo network\n- Public route: bergfilmfestival@daskino.at — [source](https://www.daskino.at/festivals/32-bergfilmfestival-2026)\n- Context: Official festival enquiry: Martin Hasenöhrl.\n- Next action: After program release on 23 October, select one talk and ask about an appropriate introduction.\n- Evidence: Dates and contact checked\n\n### Alpinmesse — Later\n- Type: Brands / event\n- Public route: alpinmesse@cmi.at — [source](https://www.alpinmesse.info/de/besuchen/oeffnungszeiten-preise)\n- Context: Official event enquiry address.\n- Next action: Request photo/media conditions; arrange two useful conversations before travelling.\n- Evidence: 21–22 November confirmed; access unarranged\n\n### Vertical Life Magazine — Later\n- Type: Editorial\n- Public route: Contributor page: Pitching section — [source](https://verticallifemag.com/contributors/)\n- Context: Section lists claire@verticallifemag.com.au; other sections show different .com addresses. Verify before sending.\n- Next action: Pitch one image and its backstory for How I Got the Shot, or a short photo essay. Ask about fit for its Australian readership.\n- Evidence: Guidelines checked; contact spelling inconsistent\n\n### Bergauf / Alpenverein — Later\n- Type: Editorial\n- Public route: Magazine page / current issue imprint — [source](https://www.alpenverein.at/portal/service/bergauf/)\n- Context: Use the current editorial route; do not mistake advertising contact for editorial.\n- Next action: Pitch one Austria-focused climbing/community story based on completed photos.\n- Evidence: Publication verified; editor route to recheck\n\n### Climbers Paradise Tirol — Later\n- Type: Regional partner\n- Public route: Official contact / imprint — [source](https://www.climbers-paradise.com/en/imprint/)\n- Context: Use official regional contact.\n- Next action: Offer a specific place + people photo story after completing a local example.\n- Evidence: Official imprint checked\n\n\nJessica’s own site publishes a direct address but appears dated; ask whether it is still the preferred channel. Its federation profile lists Innsbruck, so do not assume she is currently living near Vienna.\nSources: [athlete website](https://www.jessicapilz.at/), [Austria Climbing profile](https://www.austriaclimbing.com/athletinnen/steckbriefe/jessica-pilz.html).\nMN2S lists Jessica for bookings, but this does not by itself establish exclusive representation or the best route for a personal photo session: [listing](https://mn2s.com/booking-agency/talent-roster/jessica-pilz/).\nJohanna remains a prospect from the old plan. Current locality and contact could not be verified. Do not use contacts belonging to namesakes.\n\n## Upcoming opportunities\n- **2–4 Oct 2026 — Rock Master, Arco.** Jessica Pilz and Adam Ondra are on the published roster. Jakob is not on that roster. Meet-and-greets are advertised; a shoot is not arranged. [Official source](https://rockmaster.com/en/rock-master/athletes)\n- **3 Oct · 11:00–16:00 — Vienna Boulder Tour, Klosterneuburg.** Ask venue now. If photo access cannot be arranged, attend to meet people or choose the next stop. [Official source](https://www.viennabouldertour.at/)\n- **17 Oct · 11:00–16:00 — Vienna Boulder Tour, Blockfabrik.** More time to agree a small coverage brief and gallery delivery. [Official source](https://www.viennabouldertour.at/)\n- **23 Oct 2026 — Festival program release, Salzburg / online.** Choose one film discussion or talk when program and ticket sales open. [Official source](https://www.daskino.at/festivals/32-bergfilmfestival-2026)\n- **7 Nov · 11:00–16:00 — Vienna Boulder Tour, Boulder Monkeys.** Continue relationships from October. [Official source](https://www.viennabouldertour.at/)\n- **11–22 Nov 2026 — Bergfilmfestival, Salzburg.** Useful for photographers and documentary contacts. [Official source](https://www.daskino.at/festivals/32-bergfilmfestival-2026)\n- **14 Nov · 11:00–16:00 — Vienna Boulder Tour, Boulderbar Seestadt.** Ask host for a defined brief. [Official source](https://www.viennabouldertour.at/)\n- **21–22 Nov 2026 — Alpinmesse, Innsbruck.** Plan specific conversations before travel; ask media conditions. [Official source](https://www.alpinmesse.info/de/besuchen/oeffnungszeiten-preise)\n- **28 Nov · 11:00–16:00 — Vienna Boulder Tour, Edelweiss Floridsdorf.** Ask for a referral after delivering an earlier set. [Official source](https://www.viennabouldertour.at/)\n- **12 Dec 2026 — Vienna Boulder Tour final, das flash.** Time details still to follow on official page. [Official source](https://www.viennabouldertour.at/)\n- **7–13 Jun 2027 — World Climbing Series, Innsbruck.** Dates confirmed. Media page still describes 2026: recheck 2027 application process. [Official source](https://www.worldclimbingseries.com/)\n- **13–21 Aug 2027 — World Climbing Championship, Brno.** Dates confirmed; watch for media requirements. [Official source](https://www.brno2027.com/)\n\nRock Master is 2–4 October and overlaps the first Vienna Boulder Tour stop. Its published roster includes Jessica Pilz and Adam Ondra; Jakob Schubert is absent from that roster. This establishes advertised participation, not personal access. The official press area provides an accreditation application: [press area](https://rockmaster.com/en/press-area).\nAlpinmesse currently lists a €10 early-bird day ticket through 31 October and a €15 regular day ticket. These are admission prices only; total trip costs and photographic access are separate: [official prices](https://www.alpinmesse.info/de/besuchen/oeffnungszeiten-preise).\nThe Innsbruck media page is still for 2026. It describes accreditation through World Climbing opening one month before the competition. Treat that as background, not a confirmed 2027 opening date: [media page](https://www.worldclimbingseries.com/de/medien/).\nThe 29 September Hans Wenzl event in the old document has passed and is removed from the active list. Other older leads remain in the preserved document and need checking before travel.\n\n## Three story ideas that strengthen the approach\n1. **One attempt:** preparation, a real try, recovery and reflection. Suitable for a local climber or an elite athlete. Show why you can cover a complete session.\n2. **The climbing partnership:** climber and belayer, communication, portraits and place. Suitable for an outdoor portfolio story.\n3. **A community competition:** setting, warm-up, attempts, audience and celebration. Suitable for a gym recap, with access and intended use agreed.\n\nFor a photographer / editorial introduction, Vertical Life explicitly offers a “How I Got the Shot” section. One strong picture and its backstory can be a manageable pitch. Its contributor page has inconsistent .com / .com.au email spellings, so verify the current pitching address. Pitch before producing the full article. [Contributor guidelines](https://verticallifemag.com/contributors/).\nBergauf is an Austrian Alpine Club publication and a possible regional story outlet. Check the current issue’s editorial imprint before contacting: [magazine page](https://www.alpenverein.at/portal/service/bergauf/).\n\n## Message drafts\nReplace every bracketed item and remove any statement that is not true. Delivery and usage language here is proposed scope to agree, not a legal contract.\n### Klosterneuburg · event enquiry · German\n**Subject:** Vienna Boulder Tour am 3. Oktober – Anfrage zur fotografischen Begleitung\n\nHallo liebes Team,\n\nich bin Filip Stawiarski, Kletterer und Fotograf aus Wien, und arbeite an meinem Dokumentarfotografie-Projekt Vertical Moment.\n\nIch habe gesehen, dass die Vienna Boulder Tour am 3. Oktober bei euch stattfindet. Gibt es noch die Möglichkeit, nach Absprache eine kleine Fotostrecke vor Ort zu machen? Falls bereits jemand die Veranstaltung fotografiert, würde ich mich gern nach eurem bestehenden Ablauf richten.\n\nMein Vorschlag wäre ein klar abgegrenzter Zeitraum mit Actionbildern, Details und einigen Porträts. Umfang, Liefertermin und die Nutzung für euren Veranstaltungsrückblick würde ich gern vorher mit euch abstimmen.\n\nEine kurze Auswahl meiner bisherigen Kletterfotos findet ihr hier: [funktionierender Portfolio-Link].\n\nWer wäre dafür die richtige Ansprechperson? Falls es für Samstag zu kurzfristig ist, freue ich mich auch über eine Gelegenheit bei einer späteren Session.\n\nLiebe Grüße\nFilip Stawiarski\nVertical Moment · Wien\nf.stawiarski@gmail.com\n\n### Jessica Pilz · direct photo proposal · English\n**Subject:** A documentary climbing-photo session — Vertical Moment\n\nHi Jessica,\n\nI’m Filip Stawiarski, a Vienna-based climber and documentary photographer behind Vertical Moment. I photograph climbing around Vienna, the Wachau and the Eastern Alps.\n\nI’d love to propose a small photo story around one climbing session: the preparation, the attempts and a few portraits, shaped around a project or location you would actually like to photograph.\n\nFor a first portfolio collaboration, I would be happy to offer the session without a fee. We would agree the time, edited image selection, delivery date and permitted use before the shoot. The aim would be useful photographs for your own channels and an agreed story for my portfolio.\n\nHere is a short selection of my work: [working portfolio link].\n\nWould this interest you, and is this the right address for photo proposals? I can travel to Innsbruck if we find a suitable time.\n\nBest,\nFilip Stawiarski\nVertical Moment · Vienna\nf.stawiarski@gmail.com\n\n[Keep the Innsbruck sentence only if you are willing to travel.]\n\n### Jakob Schubert · management proposal · English\n**Subject:** Documentary photo proposal for Jakob — Vertical Moment\n\nHello Florian,\n\nI’m Filip Stawiarski, a Vienna-based climber and photographer behind Vertical Moment.\n\nI’d like to propose a small documentary session with Jakob around the process behind a climbing attempt: preparation, decisions between tries, action and portraits. I would work around a setting and time that suit him.\n\nFor a first portfolio collaboration, I would be happy to offer the session without a fee. We would agree the scope, delivery, athlete approvals and intended image use in advance, with any sponsor use discussed separately.\n\nRelevant work: [working portfolio link].\nPossible timing: [two realistic windows / travel availability].\n\nWould this be relevant to Jakob, and are you the right person to discuss it with?\n\nBest,\nFilip Stawiarski\nVertical Moment · Vienna\nf.stawiarski@gmail.com\n\n[Check any earlier contact with Jakob’s team before sending. Use a reply to the existing conversation if there is one.]\n\n### Kletterverband Wien · introduction · German\n**Subject:** Kletterfotografie in Wien – Anfrage nach einer passenden Zusammenarbeit\n\nHallo liebes Team,\n\nich bin Filip Stawiarski, Kletterer und Fotograf aus Wien. Mit Vertical Moment dokumentiere ich Klettern in Wien, der Wachau und den Ostalpen.\n\nIch suche eine erwachsene Kletterin, einen erwachsenen Kletterer oder einen Coach, die oder der Interesse an einer kleinen gemeinsamen Fotostrecke hätte: eine echte Trainingseinheit oder ein Felsprojekt, ergänzt durch Porträts und Details.\n\nHier ist eine kurze Auswahl meiner Arbeit: [funktionierender Portfolio-Link]. Für eine erste Portfolio-Zusammenarbeit würde ich die Session ohne Honorar anbieten; Ablauf, Bildauswahl, Lieferung und Veröffentlichung würden wir gemeinsam abstimmen.\n\nWäre euch jemand eingefallen, für den so eine Zusammenarbeit sinnvoll wäre, oder gibt es eine passende Veranstaltung, bei der ich mich vorstellen könnte?\n\nVielen Dank und liebe Grüße\nFilip Stawiarski\nVertical Moment · Wien\nf.stawiarski@gmail.com\n\n### Follow-up · English\n**Subject:** Re: [original subject]\n\nHi [Name],\n\nA quick follow-up on the photo idea below. I’d still be glad to work around [specific session / location] if it would be useful to you.\n\nHere is the short portfolio selection again: [link]. If another person coordinates these requests, I’d appreciate being pointed in the right direction.\n\nBest,\nFilip\n\n### Shoot confirmation · English\n**Subject:** Confirming our photo session — [date]\n\nHi [Name],\n\nThanks — here is the session we discussed:\n\nWhen and where: [date, time, location]\nDuration / activity: [agreed session]\nDelivery: [image count and actual dates you can meet]\nYour image use: [agreed channels and credit]\nMy portfolio use: [approved images, names / location details, and publication timing]\nAny sponsor or other third-party use: [agree separately if relevant]\nVenue / event arrangements: [confirmed access and contact person]\n\nPlease let me know if anything needs changing, or if there are details you prefer to keep private.\n\nBest,\nFilip\n\n### Editorial · one-image story · English\n**Subject:** Photo-story pitch: a climbing attempt in the Wachau\n\nHello [Editor],\n\nI’m Filip Stawiarski, a Vienna-based climber and photographer behind Vertical Moment.\n\nI’d like to pitch a short story around one photograph from [actual session / place]: [two sentences explaining the moment and why it matters to your readers].\n\nI can provide the selected photograph, its technical and personal backstory, and accurate captions. [State the publication permission you actually have.] A short edit is here: [link].\n\nWould this fit your “How I Got the Shot” section, or would another format suit you better?\n\nBest,\nFilip\n\n[For Vertical Life only; verify the current pitching address on its contributor page.]\n\n\n## Tracking and a useful measure of progress\nUse the accompanying dashboard to record status, sent date, follow-up date and a next step. Initial status is “Unknown / check history”; it does not imply you have never contacted that person.\nSuggested stages: Unknown / check history → Ready → Sent → Replied → Booked → Delivered → Parked.\nThe tracker saves in the browser when storage is available. Export a CSV for a portable copy; export and import JSON for a dashboard backup. Storage does not sync between browsers or devices.\nOctober target, proposed: one completed session, one delivered gallery, one approved photo story, one introduction. Count these alongside replies rather than judging progress by audience size alone.\n\nBefore a shoot, agree who can publish which photos, channels and timing. Ask the venue about event access and coordinate participant preferences through the organiser, especially if minors are involved. These are practical arrangements; the event’s general entry rules do not establish your publication permissions.\n","originalPlan":"# Austria Climbing Photography — Outreach & Relationship Plan\n\n**Vertical Moment · Filip Stawiarski · Vienna · Prepared 27 September 2026**\n\nThis is a working plan for building real climbing-photography relationships in Vienna, Lower Austria, and the wider Austrian climbing scene. Public contact routes and event dates were checked against official pages where available on 27 September 2026. Recheck dates, forms, and representatives before each approach.\n\n## 1. Goal\n\nBuild a credible body of climbing photography through a sequence of local collaborations, event relationships, editorial work, and carefully chosen athlete outreach. Use the existing Vertical Moment portfolio and the current Vienna / Wachau / Eastern Alps focus as the foundation.\n\nThe practical order is:\n\n1. Meet local climbers, clubs, gyms, and regional organizers.\n2. Complete a small number of well-run shoots and deliver exactly what was promised.\n3. Turn those shoots into approved portfolio examples and introductions.\n4. Pitch a photo story to climbing publications and event teams.\n5. Approach high-profile athletes and their representatives with a specific idea and proof of delivery.\n\nKeep the first year focused on photography and relationships around the existing VMC climbing work. Do not make a new product or a large campaign a condition for starting outreach.\n\n## 2. What to update from the original note\n\n- **The 2026 Innsbruck World Cup is over.** The next Innsbruck World Climbing Series stop is confirmed for **7–13 June 2027**. Keep it as the main Austrian competition target for 2027.\n- **Brno now has confirmed 2027 dates:** the World Climbing Championship is scheduled for **13–21 August 2027**. Keep the official event site on the watch list for tickets and media details.\n- **The Vienna Boulder Tour is more specific than the original estimate.** Its 2026 season has five Saturday qualifiers across Vienna and nearby gyms, then a final at das flash on 12 December.\n- **The outreach email should not promise unrestricted use.** “Use however you like” can include paid sponsor campaigns, advertising, resale, and sublicensing. Offer a clear, limited personal-use license for the initial collaboration, then agree on commercial use separately.\n- **Replace 15–20 finished images within 48 hours with a deliverable you can reliably meet.** Suggested default: three preview selects in 48 hours and 8–12 fully edited images within seven days. If that pace is too tight for a particular shoot, state a longer date before the session.\n- **Do not infer contact addresses from anti-spam formatting.** Jakob Schubert’s official site displays addresses containing “bdmail.” Copy what the official page displays, or use the official management / press route if it fails. Do not guess a different address.\n- **Avoid presenting current homes or schedules as facts unless the athlete or representative has recently confirmed them.** A past hometown connection can still be a good reason to write, but phrase it as background rather than current location.\n- **A media pass is not automatic.** For World Climbing events, start by checking the event’s current accreditation requirements and arrange an editorial assignment or publication relationship before relying on access.\n\n## 3. Positioning and collaboration offer\n\n### One-sentence introduction\n\n> I’m Filip, a Vienna-based climber and documentary photographer behind Vertical Moment. I photograph real climbing across Vienna, the Wachau, and the Eastern Alps, combining action, portraits, and route context.\n\nUse the “six years” detail from the original note only if it accurately describes your current portfolio and experience. Link to a short, relevant selection instead of asking someone to browse a large general portfolio.\n\n### A simple first-shoot offer\n\n- **Session:** one 60–90 minute session at a crag or gym chosen with the climber.\n- **Fee:** no session fee for a first portfolio collaboration, if that remains what you intend to offer.\n- **Delivery:** three preview selects within 48 hours; 8–12 edited photographs within seven days.\n- **Use:** the climber can use the agreed selections for personal channels and portfolio with photographer credit. Paid advertising, sponsor campaigns, product packaging, resale, or third-party licensing require a separate written agreement.\n- **Credit:** “Photo: Filip Stawiarski / Vertical Moment” with a link to verticalmoment.com where practical.\n- **Control:** agree what may be published, when it may be posted, and whether names, location, or route details should be withheld.\n\nAdjust the image count and delivery time before sending an offer if the shoot size makes the default unrealistic. Do not send RAW files unless there is a specific production reason and you have agreed how they can be used.\n\n### Three types of collaboration\n\n| Type | Best use | What to agree first |\n|---|---|---|\n| Editorial / portfolio session | An individual climber or small group | Time, location, deliverables, credit, personal-use license, and publication permission |\n| Event coverage | Competition, gym event, festival, or club activity | Organizer approval, access and safety rules, who receives images, permitted channels, deadline, and whether media accreditation is needed |\n| Commercial / sponsored work | Brand campaign, paid promotion, sponsor deliverables | Budget, usage period and territory, channels, exclusivity, deliverables, athlete approvals, and production costs |\n\n## 4. People and contact pipeline\n\nTreat this as a prospect list, not a mass-mailing list. Start with the first four rows, then add people after each shoot or event. Use the official route listed, personalize every approach, and record the date checked.\n\n### Athletes and climbers\n\n| Priority | Person or group | Why they fit | Best public route and first approach |\n|---|---|---|---|\n| A1 | **Kletterverband Wien and one adult athlete referred by the coaches** | Best route to ion database. | Start with her [Austria Climbing profile / athlete directory](https://www.austriaclimbing.com/en/athletinnen.html) and public channels. Offer a shoot around her own preferred location and schedule. |\n| A2 | **Nicolai Užnik** | Innsbruck-based Austrian boulderer with both competition and outdoor-project relevance. | The [official athlete profile](https://www.austriaclimbing.com/athletinnen/steckbriefe/uznik-nicolai.html) links to public social channels. Write only with a clear, specific angle; do not assume training access. |\n| A2 | **Kilian Fischhuber** | A respected Austrian climber, storyteller, and speaker whose work spans competition, outdoor projects, and expedition narratives. | His [official website](https://www.kilian-fischhuber.at/) publishes an inquiry address for all inquiries. Offer a small documentary shoot or ask whether there is a current project that would benefit from photography. |\n| A2 | **Angela Eiter** | A major Austrian climbing figure with a coaching / climbing-school connection, which may make a locally grounded story more relevant than a generic athlete request. | Start with her [official website](https://www.angelaeiter.com/) and current public links. Ask about the appropriate route for a portrait or coaching-day feature; confirm current details before writing. |\n| B1 | **Jakob Schubert** | A flagship Austrian competition and rock-climbing subject. His official site distinguishes business inquiries from press matters. | Use the [official inquiry section](https://www.link.jakob-schubert.com/). For business matters it lists NODUM Sports; for press matters it lists Strobl Kommunikation. Copy any address exactly as published; do not reconstruct an obfuscated address. Send a concise concept and portfolio link. |\n| B1 | **Barbara “Babsi” Zangerl** | Strong fit for an outdoor / all-round climbing story, though travel and timing may make this a longer-term lead. | Her [official website](https://barbara-zangerl.at/) and public channels are the starting point. The site was not accessible to automated browsing during this check, so confirm its contact path manually. Ask for an introduction if you meet her collaborators at a public event. |\n| B1 | **Adam Ondra** | A high-profile Czech climber and a natural cross-border prospect for the Brno championship or a Czech–Austrian climbing story. | His [official press page](https://www.adamondra.com/press-kit/) lists separate contacts for international media / events and Czech media / events. Use the international contact only for a well-developed editorial idea, not a generic request. |\n| B2 | **Janja Garnbret** | High-profile international athlete with an Innsbruck connection and an official management route through NODUM Sports. | Approach through the [NODUM Sports site](https://www.nodum-sports.com/) or her official public channels. Make the idea specific to the 2027 Innsbruck event or a genuine outdoor story. |\n| B2 | **Angelino Zeller** | A strong para-climbing subject and an opportunity to build thoughtful, athlete-led documentary work. | NODUM Sports lists him among its represented athletes. Use the official management route or public athlete channel, and ask the athlete how they prefer to shape and approve the story. |\n| B2 | **Other adult Vienna / Lower Austria climbers** | A reliable route to consistent work, repeat shoots, and strong referrals. A local portfolio often gives better access than a long list of distant stars. | Ask gym staff, coaches, adult club members, and organizers for introductions. Choose climbers who want photographs and agree on usage in advance. |\n\n### People to meet at public events\n\nUse these names as conversation opportunities, not as an invitation to interrupt someone during work or a performance.\n\n- **Rock Master, Arco (2–4 October):** the official event advertises athlete meet-and-greets and partner talks. Its 2026 athlete and side-event pages are the right place to check who is attending and when.\n- **Hans Wenzl and Robert Graimann, Vienna (29 September):** the Ringturm event includes a talk and a social gathering after it. The event listing names Naturfreunde Österreich as the contact route.\n- **Benjamin Zörer and photographer Jürgen Merz, Zirl (9 October):** the Zirler Bergfilmfestival lists Zörer as a guest and Merz’s photographs as part of the event exhibition.\n- **Tom Dauer and festival filmmakers, Tegernsee (14–18 October):** a useful gathering for mountain-film contacts, editors, and visual storytellers.\n- **Guido Unterwurzacher and Peter Salzmann, Altenmarkt (17 October):** “bergbewegt” includes a climbing / alpinism talk and a social setting after the program.\n- **Johannes Aitzetmüller, Birgit Lutz, and Stefan Lieb-Lind, Salzburg (11–22 November):** the Salzburg Bergfilmfestival has talks, film discussions, and a photo exhibition.\n- **Alpinmesse exhibitors, Innsbruck (21–22 November):** over 200 outdoor and mountain-sport exhibitors make this a practical place to meet brand and communications teams. The BlocAlpin event also adds a climbing competition to the program.\n\nAt each event, aim for one warm introduction or one follow-up permission. Do not pitch a large collaboration in a crowded queue. Ask whether you may send a short idea after the event.\n\n### Organizations, editors, and partners\n\n| Contact | Why it matters | Route |\n|---|---|---|\n| **Kletterverband Wien** | Local athlete introductions and regional event context | Official [Kletterverband Wien site](https://wien.austriaclimbing.com/); ask for a coach / adult-athlete introduction |\n| **Austria Climbing** | National team, official calendar, event organizer connections | [Athlete directory](https://www.austriaclimbing.com/en/athletinnen.html) and [official event calendar](https://data.austriaclimbing.com/Calendar) |\n| **Vienna Boulder Tour and host gyms** | The clearest near-term community circuit in Vienna | [Official tour schedule](https://www.viennabouldertour.at/); ask each gym about event photography permission and participant consent |\n| **Climbers Paradise Tirol** | Potential route / region photography and local storytelling partnership | [Official portal and contact](https://www.climbers-paradise.com/en/imprint/). It publishes climbing-area maps, topos, and photos; pitch a defined photo story or region package, not an unrestricted free image library. |\n| **Vertical Life Magazine** | A direct editorial home for photo essays and climbing stories | Read its [contributor guidelines](https://verticallifemag.com/contributors/) and pitch the angle before producing a full feature. The page gives current contributor contacts and submission expectations. |\n| **Bergauf, Österreichischer Alpenverein** | Austrian outdoor readership and potential regional feature | The 2026 issue lists the editorial contact at redaktion@alpenverein.at. Pitch an Austrian climbing photo essay or a route / community story, not a gallery with no narrative. |\n| **DAS KINO / Salzburg Bergfilmfestival** | Talks, photo exhibition, filmmakers, and mountain-culture community | The [2026 festival page](https://www.daskino.at/festivals/32-bergfilmfestival-2026) lists festival contact and current program timing. |\n| **Alpinmesse / Congress Messe Innsbruck** | Outdoor brands, event team, and climbing audience | Use the [official contact page](https://www.alpinmesse.info/en/contact). Ask about event-media permission, exhibitor access, or a small documented assignment. |\n| **World Climbing Series Innsbruck** | Main future Austrian competition target | The organizer lists general event and media contacts on its [official site](https://www.worldclimbingseries.com/). Check the [media information page](https://www.worldclimbingseries.com/de/medien/) before planning coverage. |\n| **Heinz Zak** | Austrian climbing photographer, author, and teacher; a potential mentor or peer contact | His [official website](https://www.heinzzak.com/) has a contact page and public workshop / event information. Ask one focused question or attend a public presentation; do not use third-party directory details. |\n\n## 5. Event calendar and the best use of each event\n\nAs of 27 September 2026, these are the most practical remaining opportunities. Some overlap; choose the event that best matches the next relationship you want to build.\n\n| Date | Event | Place | Outreach value and next move |\n|---|---|---|---|\n| **29 Sep 2026** | “Schritte am schmalen Grat” with Hans Wenzl | Ringturm, Vienna | Very low travel effort and a chance to meet the presenter, author, and mountain-sports community. The event listing gives the Naturfreunde contact; check ticket availability and whether the post-talk gathering is open. |\n| **2–4 Oct 2026** | Rock Master 40th anniversary | Arco, Italy | Highest athlete / brand density in the near-term list. The official event advertises athlete meet-and-greets, partner talks, guided activities, and an expo. Ask the organizer about photography rules if you want to shoot. |\n| **3 Oct 2026** | Vienna Boulder Tour qualifier 1 | Kletteranlage Klosterneuburg, 11:00–16:00 | Best nearby community option. It overlaps Rock Master. Contact the venue or tour organizer first and ask about event coverage, audience privacy, and how to request permission from participants. |\n| **9 Oct 2026** | 23rd Zirler Bergfilmfestival | B4, Zirl | Alpine film audience, athlete guest Benjamin Zörer, and a photo exhibition by Jürgen Merz. Ask the organizer whether there is a suitable time to introduce yourself to the guest or photographer. |\n| **14–18 Oct 2026** | International Mountain Film Festival Tegernsee | Tegernsee, Germany | Five days of mountain films and conversations with filmmakers. Better for editor / documentary contacts than athlete portraits. The official festival page lists the 2026 dates and program. |\n| **16–17 Oct 2026** | “bergbewegt” Alpine Dialoge | Altenmarkt im Pongau | Talks include Anita Maruna, Johanna Hiemer, Josh Absenger, Guido Unterwurzacher, and Peter Salzmann. The 17 October social / panel program makes this useful for the wider alpine-media network. It overlaps Tegernsee and the next Vienna Boulder Tour stop. |\n| **17 Oct 2026** | Vienna Boulder Tour qualifier 2 | Blockfabrik, Vienna, 11:00–16:00 | Another high-value local option. It overlaps the second day of Tegernsee and “bergbewegt”; choose based on whether local climbing relationships or mountain-film networking is the priority. |\n| **7 Nov 2026** | Vienna Boulder Tour qualifier 3 | Boulder Monkeys, 11:00–16:00 | Local community and venue relationship. |\n **7–8 Nov 2026** | KIDs Housemeisterschaft international 2026 | Bloc House, Graz | Youth event: only consider if the organizer commissions coverage and guardian / club consent is handled. Otherwise, focus on adult events. Check the official Austria Climbing calendar for updates. |\n| **11–22 Nov 2026** | Salzburg Bergfilmfestival, “Abenteuer Berg – Abenteuer Film” | DAS KINO, Salzburg | Good for filmmaker and mountain-media relationships, public conversations, and the announced photo exhibition. Festival program and tickets are published from 23 October. |\n| **14 Nov 2026** | Vienna Boulder Tour qualifier 4 | Boulderbar Seestadt, 11:00–16:00 | Local event; also check the official calendar for regional youth competitions that day. Avoid publishing photos of minors without organizer and guardian approval. |\n| **21–22 Nov 2026** | Alpinmesse with Alpinforum and BlocAlpin Bouldercup | Messe Innsbruck | Strong brand, organizer, and climbing-event networking. The official event lists 200+ exhibitors and the BlocAlpin competition. Ask in advance about media access; ordinary tickets do not automatically grant event-shooting rights. |\n| **28 Nov 2026** | Vienna Boulder Tour qualifier 5 | Edelweiss Floridsdorf, 11:00–16:00 | Last qualifier in the current published series; useful to follow up with people met earlier in the season. |\n| **12 Dec 2026** | Vienna Boulder Tour semi-final and final | das flash, Vienna | Strong local season close. Ask the venue and organizers about event-photo access, delivery needs, and a possible assignment. |\n| **7–13 Jun 2027** | World Climbing Series Innsbruck | Innsbruck | Primary 2027 Austrian competition target. Build portfolio and editorial contacts beforehand; check accreditation as soon as the event page updates. |\n| **13–21 Aug 2027** | World Climbing Championship | Brno, Czechia | Confirmed dates on the official event site. Close to Vienna and a major international opportunity. Follow the official site for tickets, schedule, press requirements, and media access; do not book travel based on assumptions about credentials. |\n\nThe Austria Climbing [calendar](https://data.austriaclimbing.com/Calendar) should be checked monthly for national, regional, adult, para-climbing, and community events. Keep annual festivals as watch-list items only until the next edition is officially announced.\n\n## 6. Outreach rhythm and follow-through\n\n### Before contacting someone\n\n1. Choose one reason this person or organization is a fit.\n2. Check their latest public channel and use the route they provide.\n3. Select six to ten portfolio images that match their activity.\n4. Decide exactly what you are offering: session, event coverage, editorial story, or commercial work.\n5. Name a location, a realistic date window, and a single next step.\n6. Include the agreed delivery and usage terms in simple language.\n\n### Contact volume\n\n- Send no more than three new, personalized approaches in a week.\n- Use one primary route per person. Do not email, DM, and contact their sponsors in the same week.\n- Send one follow-up after seven business days.\n- If there is still no response, pause for at least two months unless there is a new, relevant reason to write.\n- Record replies and promises. Close the loop when someone declines or asks not to be contacted.\n\n### Simple tracking sheet\n\nUse these columns in a private spreadsheet or notes page:\n\n| Field | Example |\n|---|---|\n| Name / organization | Kletterverband Wien |\n| Category | Local introduction |\n| Why it fits | Adult climbers and Vienna-area network |\n| Official contact route | Federation contact page |\n| Date checked | 27 Sep 2026 |\n| First approach sent | Date |\n| Follow-up due | 7 business days later |\n| Status | To research / drafted / sent / replied / meeting / completed / parked |\n| Agreed deliverables | Three previews + 8–12 edited files |\n| Usage agreed | Personal channels with credit |\n| Next action | Confirm session date |\n\n## 7. Ready-to-adapt message drafts\n\nKeep the first message short. Replace every bracketed detail with a true, researched detail before sending. Do not send every draft to the same person.\n\n### A. First approach to a climber — English\n\n**Subject:** A short climbing-photo session in [area]\n\nHi [Name],\n\nI’m Filip, a Vienna-based climber and documentary photographer behind Vertical Moment. I photograph real climbing around Vienna, the Wachau, and the Eastern Alps.\n\nI’m putting together a small photo story about [specific, accurate angle]. Your [recent route / outdoor project / connection to the area] made me think it could be a good fit. Would you be open to a 60–90 minute session at [crag or gym] sometime in [month]? I’m happy to work around the place and style you prefer.\n\nThere would be no session fee for this first portfolio collaboration. I’d send three preview selects within 48 hours and 8–12 edited images within seven days. You could use the agreed selections on your personal channels and portfolio with credit; if a sponsor or paid campaign wants to use them, we can agree that separately.\n\nHere is a short selection of relevant work: [portfolio link].\n\nWould [date option one] or [date option two] suit you, or is there someone who coordinates these requests?\n\nBest,  \nFilip Stawiarski  \nVertical Moment · Vienna  \nverticalmoment.com · f.stawiarski@gmail.com\n\n### B. First approach to a local climber — German\n\n**Betreff:** Kurzes Kletter-Fotoshooting in [Region]\n\nHallo [Name],\n\nich bin Filip, Kletterer und Fotograf aus Wien und arbeite an Vertical Moment. Ich fotografiere echtes Klettern rund um Wien, in der Wachau und in den Ostalpen.\n\nIch plane gerade eine kleine Fotostrecke über [konkretes, zutreffendes Thema]. Deine [aktuelle Route / dein Projekt / dein Bezug zur Region] könnte gut dazu passen. Hättest du Lust auf eine 60–90-minütige Fotosession am [Fels oder in der Halle], irgendwann im [Monat]? Ort und Ablauf richte ich gern nach deinen Wünschen.\n\nFür die erste Zusammenarbeit würde ich kein Honorar für die Session verrechnen. Ich schicke drei erste Bilder innerhalb von 48 Stunden und 8–12 fertig bearbeitete Fotos innerhalb von sieben Tagen. Die vereinbarten Bilder kannst du für deine persönlichen Kanäle und dein Portfolio mit Bildnachweis verwenden. Eine Nutzung durch Sponsoren oder für bezahlte Werbung würden wir gesondert vereinbaren.\n\nHier ist eine kurze Auswahl passender Arbeiten: [Portfolio-Link].\n\nWürde [Termin 1] oder [Termin 2] passen? Falls du solche Anfragen nicht selbst koordinierst, freue ich mich über einen Hinweis zur richtigen Ansprechperson.\n\nLiebe Grüße  \nFilip Stawiarski  \nVertical Moment · Wien  \nverticalmoment.com · f.stawiarski@gmail.com\n\n### C. Athlete manager or booking contact\n\n**Subject:** Documentary photo collaboration proposal for [Athlete]\n\nHello [Name],\n\nI’m Filip Stawiarski, a Vienna-based climber and photographer behind Vertical Moment. I’m reaching out with a small editorial / portfolio proposal for [Athlete], not a sponsor campaign.\n\nThe idea is a 60–90 minute documentary session at [location or region] around [specific story angle]. There would be no session fee. I would deliver three preview images in 48 hours and 8–12 edited photographs within seven days. The proposed initial use is limited to [Athlete]’s personal channels and portfolio with credit. Any sponsor, paid-media, or third-party use would be discussed and licensed separately.\n\nPortfolio: [short link].  \nPossible timing: [two date windows].  \nThe session can take place wherever [Athlete] prefers.\n\nWould this be relevant for [Athlete], and is this the right channel for a personal editorial collaboration?\n\nThank you,  \nFilip Stawiarski  \nVertical Moment · Vienna  \nverticalmoment.com · f.stawiarski@gmail.com\n\n### D. Gym, club, or event organizer — German\n\n**Betreff:** Anfrage zu autorisierter Eventfotografie bei [Veranstaltung]\n\nHallo [Name / Team],\n\nich bin Filip Stawiarski, Kletterer und Fotograf aus Wien. Ich fotografiere für Vertical Moment Kletterinnen, Kletterer und die Orte, an denen die Community zusammenkommt.\n\nIch würde gern fragen, ob für [Veranstaltung] eine autorisierte fotografische Begleitung möglich ist. Ich kann nach vorheriger Absprache eine kleine Auswahl bearbeiteter Bilder für [konkreter Kanal, z. B. Rückblick auf der Website] liefern. Bevor ich plane, möchte ich klären, welche Zugangs-, Sicherheits- und Einwilligungsregeln gelten und welche Nutzung für die Bilder vorgesehen wäre.\n\nPortfolio: [Link]  \nMein Vorschlag: [kurzer Umfang und Lieferzeit]\n\nWäre dafür [Name / Abteilung] die richtige Ansprechperson?\n\nVielen Dank und liebe Grüße  \nFilip Stawiarski  \nVertical Moment · Wien\n\n### E. World Climbing media / accreditation question\n\n**Subject:** Media access question for World Climbing Series Innsbruck 2027\n\nHello [Media contact],\n\nI’m Filip Stawiarski, a Vienna-based climbing photographer working on documentary stories for Vertical Moment. I’m planning ahead for the World Climbing Series in Innsbruck, 7–13 June 2027.\n\nMy intended coverage is [one specific story and intended publication / outlet]. My portfolio is here: [link]. Could you point me to the current accreditation requirements and let me know whether independent digital publications are eligible, or whether I should first arrange an assignment or confirmation letter from an editorial outlet?\n\nI understand that registration is not a guarantee of accreditation and will follow the event’s access and photography rules.\n\nThank you,  \nFilip Stawiarski  \nVertical Moment · Vienna\n\n### F. Editorial pitch — Vertical Life or Bergauf\n\n**Subject:** Photo-essay pitch: [specific Vienna / Wachau climbing story]\n\nHello [Editor],\n\nI’m a Vienna-based climber and photographer with Vertical Moment. I’d like to pitch a short photo essay about [specific story, place, and people].\n\n**Why now:** [one sentence about why the story matters to your readers].  \n**Access:** [who has agreed to speak or be photographed; do not imply access you do not have].  \n**Visuals:** [number and type of images; note that publication permission will be confirmed].  \n**Text:** [short caption-led story / interview / reported essay].  \n**Portfolio:** [short link].\n\nWould this fit an upcoming issue or web feature? I can send a one-page treatment and a small image edit if useful. I’ll wait for interest before producing a full article or exclusive photo set.\n\nBest,  \nFilip Stawiarski  \nVertical Moment · Vienna\n\n### G. Follow-up after seven business days\n\n**Subject:** Re: [original subject]\n\nHi [Name],\n\nJust following up once on my note below in case it got buried. I’d still be glad to make [one specific session / story] work around your schedule. If it is not a fit right now, no problem.\n\nPortfolio: [short link]\n\nBest,  \nFilip\n\n### H. Confirming a shoot and image use\n\nHi [Name],\n\nThanks — let’s plan for [date/time] at [location]. We’ll shoot for about [duration], and you’ll choose the routes / activity. I’ll bring [equipment / safety plan].\n\nI’ll deliver three preview selects by [date] and 8–12 edited images by [date]. The agreed images may be used on your personal channels and portfolio with credit to Filip Stawiarski / Vertical Moment. Sponsor campaigns, paid advertising, resale, or use by another party need a separate agreement.\n\nPlease tell me before the session if there are any images, route details, or personal information you do not want published. I’ll check with the venue / organizer about any additional rules.\n\nBest,  \nFilip\n\n## 8. 90-day action plan\n\n### Days 1–7: prepare\n\n- Pick 10–15 images that show action, portrait, detail, location, and a complete story.\n- Create one short portfolio link for athletes and one for editorial / event contacts.\n- Remove or obtain permission for any identifiable image that should not be published.\n- Make the delivery and image-use terms consistent across the website, email, and confirmation note.\n- Choose the first three approaches: Kletterverband Wien, one adult local climber, and a Vienna Boulder Tour host or organizer.\n\n### Days 8–30: make local connections\n\n- Attend one event from the October calendar that is realistic to reach.\n- Ask for permission before photographing in a gym or organized competition.\n- Send up to three tailored approaches a week and one follow-up per unanswered message.\n- Book one outdoor or gym session with an adult climber.\n- Deliver the finished gallery on time and ask for approval before using any image in a public portfolio.\n\n### Days 31–60: build proof\n\n- Publish one approved short photo story on Vertical Moment.\n- Ask the subject for one introduction to a climber, coach, or event organizer.\n- Send a short pitch to Vertical Life or Bergauf based on the completed work.\n- Contact a regional partner such as Climbers Paradise with a limited, defined photo-story proposal.\n\n### Days 61–90: move up one level\n\n- Use the completed local work as proof when approaching Jessica Pilz, Jakob Schubert, Nicolai Užnik, Kilian Fischhuber, or a representative.\n- Start a 2027 Innsbruck media conversation early and check whether an editorial assignment is needed.\n- Follow the official Brno 2027 site for its program and media requirements.\n- Review which approaches produced replies, introductions, booked sessions, and portfolio-quality work. Keep the people and channels that worked; park the rest.\n\n## 9. Risks and practical safeguards\n\n- **Image rights:** State the allowed channels and commercial limits in writing before delivering files. A free session should not silently become a free sponsor campaign.\n- **Event access:** A ticket, invitation, or personal relationship may not authorize photography from restricted areas or for publication. Ask the venue / event team first.\n- **Minors:** Approach through the club or organizer and require guardian consent. Do not DM junior athletes directly or publish identifiable images without the required approvals.\n- **Safety:** The climber and belayer decide the safe position and activity. Do not ask anyone to repeat a move, change gear, or take a risk for a photograph.\n- **Overpromising:** Only offer delivery dates you can meet. A late, overly large free gallery damages trust more than a smaller, timely one.\n- **Cold outreach:** A manager may treat a photo request as a commercial booking. Label a free editorial proposal accurately and keep it separate from sponsor work.\n- **Contact accuracy:** Use public official contact pages and recheck them before sending. Do not use personal contact details copied from people-search directories or inferred from anti-spam text.\n- **Travel and schedule:** Rock Master overlaps with the first Vienna Boulder Tour stop on 3 October. Tegernsee overlaps with “bergbewegt” and the second tour stop on 17 October. Choose by goal instead of trying to cover every event.\n\n## 10. Sources to keep current\n\n- [Vienna Boulder Tour — 2026 schedule](https://www.viennabouldertour.at/)\n- [Rock Master Arco — official event and side events](https://rockmaster.com/en)\n- [Zirler Bergfilmfestival — Zirl municipality event page](https://www.zirl.gv.at/Bergfilmfestival_2026)\n- [“Schritte am schmalen Grat” — event listing with organizer contact](https://app.bergsteigen.com/service/termine/schritte-am-schmalen-grat-hans-wenzls-multimediashow-im-ringturm/)\n- [International Mountain Film Festival Tegernsee — 2026](https://www.bergfilm-tegernsee.de/2026-2/)\n- [Salzburg Bergfilmfestival — 2026](https://www.daskino.at/festivals/32-bergfilmfestival-2026)\n- [Bergrettung Salzburg — “bergbewegt” dates](https://www.bergrettung-salzburg.at/news/bergbewegt-alpine-dialoge-in-altenmarkt/)\n- [Alpinmesse — 2026 dates](https://www.alpinmesse.info/de/besuchen/oeffnungszeiten-preise)\n- [Alpinmesse — BlocAlpin Bouldercup](https://www.alpinmesse.info/de/besuchen/boulder-cup)\n- [Austria Climbing event calendar](https://data.austriaclimbing.com/Calendar)\n- [World Climbing Series Innsbruck — 2027 event information](https://www.worldclimbingseries.com/)\n- [World Climbing Series Innsbruck — media information](https://www.worldclimbingseries.com/de/medien/)\n- [Brno 2027 World Climbing Championship — official site](https://www.brno2027.com/)\n- [Kletterverband Wien — 2026 squad](https://wien.austriaclimbing.com/athletinnen/wiener-kader-2026.html)\n- [Austria Climbing — national athlete directory](https://www.austriaclimbing.com/en/athletinnen.html)\n- [Jakob Schubert — official inquiries](https://www.link.jakob-schubert.com/)\n- [Jessica Pilz — MN2S booking inquiry](https://mn2s.com/booking-agency/talent-roster/jessica-pilz/)\n- [Kilian Fischhuber — official site](https://www.kilian-fischhuber.at/)\n- [Nicolai Užnik — Austria Climbing profile](https://www.austriaclimbing.com/athletinnen/steckbriefe/uznik-nicolai.html)\n- [Adam Ondra — official press page](https://www.adamondra.com/press-kit/)\n- [Vertical Life — contributor guidelines](https://verticallifemag.com/contributors/)\n- [Bergauf — Austrian Alpine Club magazine](https://www.alpenverein.at/portal/service/bergauf/)\n- [Climbers Paradise Tirol — contact and remit](https://www.climbers-paradise.com/en/imprint/)\n- [Heinz Zak — official site](https://www.heinzzak.com/)\n\nKeep this plan as a living document. Before each season, replace tentative entries with confirmed dates and recheck the athlete and organization contact routes.\n"}}</script>

  return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]} ${b.getFullYear()}`}
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
function today(){const o=S['today'];return o?pd(o):today0()}

/* ---------- state + persistence ---------- */
let S={},saveError='',storageLoadFailed=false,saveLabel='Entries stay in this browser · export backups',lastSaved='';
function safeState(value){if(!value||typeof value!=='object'||Array.isArray(value))throw Error('Expected an entries object');const out={};for(const [k,v] of Object.entries(value)){if(['__proto__','constructor','prototype'].includes(k)||k.length>500||!(/^(cal:|pt:|ac:|out:|ui:|meta:|today$)/.test(k)))throw Error('Unrecognized entry key');if(!['string','number','boolean'].includes(typeof v)||String(v).length>50000)throw Error('Invalid entry value');if(k==='today'&&v&&!validDate(v))throw Error('Invalid planning date');out[k]=v}return out}
function validDate(v){if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const d=pd(v);return d&&d.getFullYear()===Number(v.slice(0,4))&&d.getMonth()+1===Number(v.slice(5,7))&&d.getDate()===Number(v.slice(8,10))}
try{const raw=localStorage.getItem('climbplanner.v1');if(raw)S=safeState(JSON.parse(raw))}catch(e){storageLoadFailed=true;saveError='Previous entries could not be loaded. Restore a backup before editing.'}

function persist(){if(storageLoadFailed){setSaveText();return}try{localStorage.setItem('climbplanner.v1',JSON.stringify(S));saveError='';lastSaved=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});saveLabel='Saved in this browser · '+lastSaved}catch(e){saveError='Saving unavailable — export a backup before closing.'}setSaveText()}

  if(c&&c.i)return h('a',{href:'#'+slug(c.i),onclick:e=>{e.preventDefault();go(c.i)}},label||c.v);return null}
const chip=t=>h('span',{class:'chip '+(t==='A'||t==='B'||t==='C'?t:'x')},t);

/* ---------- tabs ---------- */
const TABS=[
 ['Plan',[['Home','#DCE4EA'],['Start Here','#DCE4EA'],['Overview','#DCE4EA'],['Weekend Picks','#F9A66C'],['Calendar','#F9A66C'],['Pitch Tracker','#F9A66C']]],
 ['Vienna area',[['Gym Directory','#A5D8FF'],['Courses & Workshops','#A5D8FF'],['Portfolio Leads','#A5D8FF']]],
 ['Alpine Austria',[['Alpine Regions','#8FBF8F'],['Alpine Halls','#8FBF8F'],['Association & Courses','#8FBF8F'],['2027 Season Map','#8FBF8F']]],
 ['Keep it current',[['Annual Cycle','#999999'],['Sources & Contacts','#999999']]]];
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const ALL=TABS.flatMap(g=>g[1].map(t=>t[0]));

function buildTabs(){const box=document.getElementById('tabs');box.textContent='';
  TABS.forEach(([g,items])=>{box.append(h('div',{class:'grp',text:g}));
    items.forEach(([n,c])=>box.append(h('button',{class:'tab',type:'button',style:'--c:'+c,'aria-current':n===cur?'page':null,onclick:()=>go(n)},h('i',{style:'background:'+c}),n)))})}
function go(n){cur=n;history.replaceState(null,'','#'+slug(n));buildTabs();render();window.scrollTo(0,0);
  const a=document.querySelector('.tab[aria-current]');if(a&&a.scrollIntoView)a.scrollIntoView({block:'nearest',inline:'center'})}

  return h('div',{class:'wrap'},t)}
function generic(name,extra){const sh=G[name];
  const main=document.getElementById('main');main.append(h('h1',{text:sh.title||name}),sh.note?h('p',{class:'sub',text:sh.note}):null);
  let q='',fv='';
