<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climbing Planner Austria · 2026–27</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F1F4F3; --card:#FFFFFF; --ink:#18212B; --muted:#586573; --line:#D3DAD9; --soft:#E7ECEB;
  --nav:#1F2A37; --navink:#DCE4EA; --navmute:#93A1AE;
  --link:#1A57B5; --tierA:#F9A66C; --tierAink:#5A2A06; --tierB:#A5D8FF; --tierBink:#0B3556; --tierC:#E1E6E5; --tierCink:#43505C;
  --ok:#2F7D4F; --okbg:#DDF0E4; --warnbg:#FFE7C7; --warnink:#7A3F00; --focus:#1A57B5;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --head:'Archivo','Arial Narrow',system-ui,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12181F; --card:#1A222B; --ink:#E6ECEF; --muted:#9DABB7; --line:#2E3946; --soft:#232D38;
    --nav:#0D1319; --link:#7DB2FF; --tierAink:#FFD9BD; --tierBink:#CDE9FF; --tierCink:#B8C3CC;
    --tierA:#8A4A1F; --tierB:#1F4E73; --tierC:#2B3641; --okbg:#1E3B2A; --ok:#7FD09C; --warnbg:#4A3413; --warnink:#FFCE8A; --focus:#7DB2FF;
  }
}
:root[data-theme="dark"]{
  --paper:#12181F; --card:#1A222B; --ink:#E6ECEF; --muted:#9DABB7; --line:#2E3946; --soft:#232D38;
  --nav:#0D1319; --link:#7DB2FF; --tierAink:#FFD9BD; --tierBink:#CDE9FF; --tierCink:#B8C3CC;
  --tierA:#8A4A1F; --tierB:#1F4E73; --tierC:#2B3641; --okbg:#1E3B2A; --ok:#7FD09C; --warnbg:#4A3413; --warnink:#FFCE8A; --focus:#7DB2FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--link)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
nav.rail{background:var(--nav);color:var(--navink);padding:20px 0 24px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;overflow-y:auto}
.brand{padding:0 20px 16px;font:800 19px/1.15 var(--head);letter-spacing:.01em}
.brand small{display:block;margin-top:4px;font:500 12px/1.3 var(--sans);color:var(--navmute)}
.grp{margin:14px 0 4px;padding:0 20px;font:600 12px var(--sans);color:var(--navmute)}
.tab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;color:var(--navink);padding:8px 20px 8px 16px;cursor:pointer}
.tab i{width:10px;height:10px;border-radius:2px;flex:none}
.tab:hover{background:rgba(255,255,255,.07)}
.tab[aria-current="page"]{background:rgba(255,255,255,.12);font-weight:600;border-left-color:var(--c)}
.railfoot{padding:16px 20px 0;font-size:12px;color:var(--navmute)}
.railfoot button{margin-top:8px;background:none;border:1px solid #4A5866;color:var(--navink);border-radius:6px;padding:5px 10px;cursor:pointer;margin-right:6px}
main{padding:28px clamp(16px,3vw,40px) 64px;min-width:0}
h1{font:800 clamp(26px,3.4vw,38px)/1.08 var(--head);margin:0 0 6px;letter-spacing:-.005em}
h2{font:700 20px/1.2 var(--head);margin:28px 0 10px}
.sub{color:var(--muted);max-width:78ch;margin:0 0 18px}
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:14px 0}
.bar input[type=search],.bar select,.bar input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:38px}
.bar input[type=search]{flex:1 1 220px;min-width:0}
.chk{display:inline-flex;align-items:center;gap:6px;min-height:38px}
.count{color:var(--muted);font-size:13px;margin-left:auto}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--nav);color:#fff;font:600 13px var(--sans);white-space:nowrap;position:relative}
th.sort{cursor:pointer;text-decoration:underline dotted;text-underline-offset:5px}
td a{overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center}
.chip{display:inline-block;min-width:26px;text-align:center;padding:1px 8px;border-radius:5px;font:700 13px var(--head)}
.chip.A{background:var(--tierA);color:var(--tierAink)}.chip.B{background:var(--tierB);color:var(--tierBink)}.chip.C,.chip.x{background:var(--tierC);color:var(--tierCink)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:var(--soft);font-size:12px;color:var(--muted)}
.tag.on{background:var(--okbg);color:var(--ok)}
.past td{opacity:.5}
.due td:first-child{box-shadow:inset 4px 0 0 var(--tierA)}
.due{background:var(--warnbg)}
.ev b{font-weight:600}.ev .where{color:var(--muted);font-size:13px}
.mini{font-size:13px;color:var(--muted)}
.det td{background:var(--soft);font-size:14px}
.det dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
.det dt{color:var(--muted)}.det dd{margin:0}
.exp{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:13px}
select.st,input.st{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 6px;min-height:34px;max-width:100%}
select.st.set{background:var(--okbg);border-color:var(--ok)}
input.st.narrow{width:90px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}.stat b{font:800 18px var(--head)}
.board{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
.board li{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.board li:last-child{border:0}
.days{font:800 30px/1 var(--head);text-align:center}.days small{display:block;font:500 12px var(--sans);color:var(--muted);margin-top:2px}
.board .t{font-weight:600}.board .m{color:var(--muted);font-size:13px}
.steps a.tablink{font-weight:600}
.notes li{margin:5px 0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--nav);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:8px 14px;min-height:38px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--nav);color:#fff;font-weight:600}
.mhead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.mhead h2{margin:0 8px 0 0;font-size:22px}
.mhead button{background:var(--card);border:1px solid var(--line);border-radius:8px;min-height:38px;min-width:38px;padding:0 12px;cursor:pointer}
.mhead button:disabled{opacity:.4;cursor:default}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mg .dow{background:var(--nav);color:#fff;font:600 13px var(--sans);padding:8px 6px;text-align:center}
.mg .day{background:var(--card);border:0;text-align:left;min-height:108px;padding:5px 5px 6px;cursor:pointer;display:block;min-width:0}
.mg .day:hover{background:var(--soft)}
.mg .day.out{opacity:.45}
.mg .day.sel{outline:2px solid var(--focus);outline-offset:-2px}
.mg .num{display:inline-block;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;font:700 13px var(--head)}
.mg .day.today .num{background:var(--nav);color:#fff}
.mchip{display:block;margin-top:3px;padding:1px 6px;border-radius:4px;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mchip.A{background:var(--tierA);color:var(--tierAink)}.mchip.B{background:var(--tierB);color:var(--tierBink)}.mchip.C{background:var(--tierC);color:var(--tierCink)}
.mchip.fin{opacity:.5}
.more{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.dayp{margin-top:16px}
.dayp .ev2{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.dayp .ev2 .sels{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:900px){
  .app{display:block}
  nav.rail{position:sticky;height:auto;padding:8px 0;z-index:5;overflow:visible}
  .brand,.grp,.railfoot{display:none}
  .tabs{display:flex;overflow-x:auto;gap:2px;padding:0 8px;scrollbar-width:thin}
  .tab{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:8px 10px;border-radius:6px 6px 0 0}
  .tab[aria-current="page"]{border-bottom-color:var(--c)}
  main{padding-top:18px}
}
@media (max-width:720px){
  .wrap{border:0;background:none;overflow:visible}
  table,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tr{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 0}
  td{border:0;padding:5px 14px}
  td::before{content:attr(data-l);display:block;color:var(--muted);font-size:12px}
  td.nolabel{display:block}td.nolabel::before{display:none}
  td.num{text-align:left}
  .det td{display:block}
  .mg .day{min-height:58px;padding:3px}
  .mg .dow{font-size:11px;padding:6px 2px}
  .mchip{font-size:0;height:6px;padding:0;margin-top:3px}
  .more{font-size:10px}
  .board li{grid-template-columns:60px 1fr}.board li>span:last-child{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---------- crag index ---------- */
.crag-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin:6px 0 0}
.crag-pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--soft);font-size:12px;color:var(--muted);font-weight:600}
.crag-pill.disc{background:var(--okbg);color:var(--ok)}
.crag-card{display:flex;flex-direction:column;gap:8px}
.crag-card h3{margin:0;font:700 17px/1.25 var(--head)}
.crag-card .crag-desc{margin:0;color:var(--muted);font-size:14px}
.crag-card .crag-access{margin:0;font-size:13px;padding:8px 10px;background:var(--warnbg);color:var(--warnink);border-radius:8px}
.crag-card .crag-links{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:auto}
.crag-card .crag-links a{font-weight:600}
.freshness{font-size:12px;color:var(--muted)}
.source-type{display:inline-block;padding:2px 7px;border-radius:4px;background:var(--soft);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em}

/* ---------- climber hub additions ---------- */
.hub-emergency{margin:16px 0;padding:12px 16px;background:var(--warnbg);color:var(--warnink);border:1px solid var(--line);border-radius:10px}
.hub-emergency a{font-weight:700}
.hub-block{margin:22px 0 28px}
.hub-block h2{margin-top:0}
.check-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0}
.check-controls progress{width:min(260px,100%);height:14px;accent-color:var(--ok)}
.check-status{font-size:13px;color:var(--muted)}
.check-controls button:disabled{opacity:.5;cursor:default}
.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:10px}
.check-row{display:flex;flex-direction:column;justify-content:space-between;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.check-label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;cursor:pointer}
.check-label input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ok)}
.check-label span span{display:block;margin-top:4px;color:var(--muted);font-size:14px}
.check-row>a{font-weight:600;align-self:flex-start}
.resource-section{margin:22px 0}
.resource-section h2{margin-bottom:10px}
.resource-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.resource-card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;min-width:0}
.resource-card h3{font:700 18px/1.2 var(--head);margin:0}
.resource-card p{margin:0;color:var(--muted);max-width:68ch}
.resource-card>a{margin-top:auto;font-weight:600}
.resource-kind{display:inline-block;padding:3px 8px;background:var(--soft);border-radius:999px;color:var(--muted);font-size:12px;font-weight:600}
.hub-footnote{margin-top:22px}
.resource-card[hidden],.resource-section[hidden],.resource-section h2[hidden]{display:none}

.trip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px;margin:14px 0}
.trip-panel{display:flex;flex-direction:column;gap:8px;min-width:0}
.trip-panel h3{font:700 16px/1.25 var(--head);margin:0}
.trip-panel ul{margin:0;padding-left:1.15em}
.trip-panel li{margin:4px 0}
.trip-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin:8px 0 14px;font-size:13px;color:var(--muted)}
.trip-meta span{background:var(--soft);padding:2px 8px;border-radius:999px}
.trip-select-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:12px 0 18px}
.trip-select-bar label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:min(100%,220px)}
.trip-select-bar select{min-height:38px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.trip-access{border-left:4px solid var(--tierA);padding-left:12px;margin:10px 0}

.entry-paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin:18px 0}.task-card{padding:16px}.task-card h2{margin-top:0}
.trip-plan-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:12px}.trip-plan-fields label{display:grid;gap:4px;font-weight:600}.trip-plan-fields input,.trip-plan-fields select,.trip-plan-fields textarea{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.trip-plan-fields .trip-notes-field{grid-column:1/-1}
.task-card button,.trip-plan-actions{margin:6px 6px 0 0}.coverage-summary,.registry-audit,.offline-note,.lang-note{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin:12px 0}.coverage-summary p{margin:4px 0 0}.coverage-badge{display:inline-flex;padding:2px 8px;margin:4px 0;border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:600}.coverage-badge.area{background:var(--okbg);color:var(--ok)}.coverage-badge.cluster{background:var(--warnbg);color:var(--warnink)}.coverage-badge.overview{background:var(--soft);color:var(--muted)}.source-freshness{border-top:1px solid var(--line);padding-top:7px}.trip-saved-tools{margin:12px 0;padding:16px}.trip-saved-tools h2{margin-top:0}.trip-print-summary{display:none}
@media(max-width:760px){.entry-paths{grid-template-columns:1fr}.trip-plan-fields .trip-notes-field{grid-column:auto}}
@media print{body{background:#fff!important;color:#111!important;font:11pt/1.4 Arial,sans-serif}.app{display:block;min-height:0}nav.rail,.trip-saved-tools,.trip-select-bar,.bar,.lang-note,button,.toast{display:none!important}main{padding:0!important;max-width:none!important}.trip-print-summary{display:block!important;margin:0 0 14px;padding:0 0 10px;border-bottom:1px solid #777}.card,.coverage-summary,.registry-audit{break-inside:avoid;box-shadow:none!important;background:#fff!important;color:#111!important}a{color:#111!important;text-decoration:underline}}
</style>
<style id="fieldday-styles">
.field-shell{max-width:54rem;margin:0 auto;padding:4px 0 5.5rem}
.field-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.field-kicker,.field-small{font-size:12px;color:var(--muted)}
.field-kicker{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.field-mode-nav{position:sticky;bottom:0;z-index:4;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:24px -8px 0;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left));border-top:1px solid var(--line);background:var(--card)}
.field-mode-nav button{min-height:52px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}
.field-mode-nav button[aria-current=page]{background:var(--soft);color:var(--ink);border-color:var(--line)}
.field-mode-nav .field-mode-icon{display:block;font-size:16px;line-height:1.1;margin-bottom:3px;color:#C4A574}
.field-place-chip{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.field-place-name{font-weight:800;font-size:17px}
.field-place-meta{flex:1 1 100%;font-size:13px;color:var(--muted)}
.field-status-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.field-status-cell{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;min-height:76px}
.field-status-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.field-status-value{margin-top:5px;font-size:14px;font-weight:700}
.field-status-cell[data-kind=warn]{border-left:4px solid #FFCE8A}
.field-status-cell[data-kind=ok]{border-left:4px solid #7FD09C}
.field-panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}
.field-panel h2{margin:0 0 9px;font-size:17px}
.field-jobs{display:grid;gap:8px}
.field-job{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:start;gap:9px;padding:11px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
.field-job input{width:18px;height:18px;margin:2px 0 0;accent-color:#2F7D4F}
.field-job-title{display:block;font-weight:700}
.field-job-detail{display:block;margin-top:3px;font-size:12px;color:var(--muted)}
.field-job a{white-space:nowrap;font-size:12px;font-weight:700}
.field-job.is-done .field-job-title{text-decoration:line-through;text-decoration-thickness:1px;opacity:.75}
.field-quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.field-quick a,.field-quick button{min-height:66px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;padding:8px 4px;border:1px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);text-align:center;text-decoration:none;font-size:11px;font-weight:700;cursor:pointer}
.field-quick-icon{font-size:17px;color:#C4A574;line-height:1}
.field-alert{border-left:4px solid #FFCE8A;padding:9px 12px;background:var(--soft);border-radius:8px;font-size:13px}
.field-notes{width:100%;min-height:88px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);resize:vertical}
.field-primary,.field-secondary{min-height:40px;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}
.field-primary{border:1px solid #C4A574;background:#C4A574;color:#1A222B}
.field-secondary{border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.field-actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.field-empty{text-align:center;padding:26px 16px}
.field-empty h2{margin:0 0 8px}
.field-empty p{color:var(--muted);max-width:34rem;margin:0 auto 14px}
.field-steps{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}

function validateSources(rows){
 const seen=new Set(),ok=[],disc=['sport','boulder','alpine','via-ferrata','ice','drytooling','all'];
 function dateOK(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const d=new Date(s+'T00:00:00Z');return !Number.isNaN(d.valueOf())&&d.toISOString().slice(0,10)===s}
 rows.forEach(function(r,i){
  const p=[];
  if(!r||typeof r!=='object')p.push('not an object');
  else{
   if(typeof r.name!=='string'||!r.name.trim())p.push('missing name');
   if(!r.type||!['official','regional-guide','publisher','community'].includes(r.type))p.push('invalid type');
   let key='';
   try{const u=new URL(r.url);if(!['https:','http:'].includes(u.protocol))p.push('URL must use HTTP or HTTPS');if(u.username||u.password)p.push('URL credentials are not allowed');key=u.href.toLowerCase()}catch(e){p.push('malformed URL')}
   if(key&&seen.has(key))p.push('duplicate URL');
   if(r.discipline!=null&&(!Array.isArray(r.discipline)||r.discipline.some(x=>!disc.includes(x))))p.push('invalid discipline list');
   if(r.language!=null&&(!Array.isArray(r.language)||r.language.some(x=>typeof x!=='string'||!/^[a-z]{2,3}$/.test(x))))p.push('invalid language list');
   if(r.offline!=null&&!['true','false','unknown'].includes(String(r.offline)))p.push('invalid offline value');
   if(r.checked!==null&&r.checked!==undefined&&!dateOK(r.checked))p.push('invalid checked date');
   ['region','price','group','kind','description'].forEach(k=>{if(r[k]!=null&&typeof r[k]!=='string')p.push(k+' must be text or null')});
  }
  if(p.length){try{console.warn('[source-registry] row '+(i+1)+' skipped: '+p.join(', '))}catch(e){};return}
  try{seen.add(new URL(r.url).href.toLowerCase())}catch(e){}
  ok.push(r);
 });
 return ok;
}const SOURCES = validateSources(SOURCE_REGISTRY);

function sourceCard(r){

    r.description?h('p',{text:r.description}):h('p',{class:'mini',text:'No description recorded.'}),
    h('p',{class:'mini',text:meta})
  );
  card.append(h('a',{href:r.url,target:'_blank',rel:'noopener noreferrer','aria-label':'Open '+r.name+' in a new tab'},'Visit source site'));
  return card;
}

V['Crag index']=function(){
 const main=document.getElementById('main');
 main.append(
  h('h1',{text:'Crag index'}),
  h('p',{class:'sub',text:'A curated Austria-first starter index for trip ideas — not a complete national database and not a substitute for a current topo or local access notice. Checked 1 October 2026. Community route databases are labelled as such; closures and nesting restrictions must be confirmed with the Alpenverein finder, the responsible club or the land manager.'})
 );
 main.append(h('aside',{class:'hub-emergency','aria-label':'Access reminder'},
  h('b',{text:'Access & closures: '}),
  h('span',{text:'Prefer the official Alpenverein map (red outline = area shown closed), then the local club or operator. '}),
  h('a',{href:'https://www.alpenverein.at/portal/wGlobal/content/finder/kletteranlagen.php',target:'_blank',rel:'noopener noreferrer'},'Open Alpenverein finder'),
  h('span',{text:' · '}),
  h('a',{href:'#climbing-resources',onclick:function(e){e.preventDefault();go('Climbing Resources')}},'Before-you-go checklist')
 ));

 const regions=[...new Set(CRAG_INDEX.map(c=>c.region))].sort();
 const clusters=[...new Set(CRAG_INDEX.map(c=>c.cluster))].sort();
 const discs=[...new Set(CRAG_INDEX.flatMap(c=>c.disciplines))].sort();
 const f={q:'',region:'',cluster:'',disc:''};
 const search=h('input',{type:'search',placeholder:'Search crag, region, rock, notes…','aria-label':'Search crags'});
 const reg=h('select',{'aria-label':'Filter by federal state'},h('option',{value:''},'All states'),regions.map(r=>h('option',{value:r},r)));
 const clu=h('select',{'aria-label':'Filter by area cluster'},h('option',{value:''},'All area clusters'),clusters.map(r=>h('option',{value:r},r)));
 const dis=h('select',{'aria-label':'Filter by discipline'},h('option',{value:''},'All disciplines'),discs.map(r=>h('option',{value:r},r)));
 const count=h('span',{class:'count','aria-live':'polite'});
 const bar=h('div',{class:'bar'},search,reg,clu,dis,count);
 main.append(bar);

 const grid=h('div',{class:'resource-grid'});
 main.append(grid);
 main.append(h('p',{class:'mini hub-footnote',text:'This index deliberately starts small. Tirol is better covered digitally via Climbers Paradise; eastern Austria relies more on local topos (e.g. Dynamo) and printed guides. Vorarlberg and Kärnten are overview placeholders until more verified public sources are added. Grade ranges are approximate pointers only.'}));

 function draw(){
  grid.textContent='';
  const q=f.q;
  let rows=CRAG_INDEX.filter(c=>{
   if(f.region&&c.region!==f.region)return false;
   if(f.cluster&&c.cluster!==f.cluster)return false;
   if(f.disc&&c.disciplines.indexOf(f.disc)===-1)return false;
   if(q){
    const hay=[c.name,c.region,c.cluster,c.rock,c.aspect,c.season,c.approach,c.transit,c.family,c.grades,c.notes,c.access,(c.disciplines||[]).join(' ')].join(' ').toLowerCase();
    if(hay.indexOf(q)===-1)return false;
   }
   return true;
  });
  count.textContent=rows.length+' of '+CRAG_INDEX.length+' areas';
  if(!rows.length){
   grid.append(h('div',{class:'empty',text:'No areas match these filters. Clear a filter or search term.'}));
   return;
  }
  rows.forEach(c=>{
   const card=h('article',{class:'card crag-card'});
   card.append(
    h('div',null,
     h('span',{class:'source-type',text:c.topo.kind}),
     h('h3',{text:c.name}),
     h('div',{class:'crag-meta'},
      h('span',{class:'crag-pill',text:c.region}),
      h('span',{class:'crag-pill',text:c.cluster}),
      c.disciplines.map(d=>h('span',{class:'crag-pill disc',text:d}))
     )
    ),
    h('p',{class:'crag-desc',text:c.notes}),
    h('div',{class:'mini'},
     h('div',null,h('b',{text:'Rock / aspect: '}),c.rock+' · '+c.aspect),
     h('div',null,h('b',{text:'Season: '}),c.season),
     h('div',null,h('b',{text:'Approach: '}),c.approach),
     h('div',null,h('b',{text:'Transit: '}),c.transit),
     h('div',null,h('b',{text:'Grades (approx.): '}),c.grades),
     h('div',null,h('b',{text:'Family / mixed groups: '}),c.family)
    ),
    h('p',{class:'crag-access'},h('b',{text:'Access check: '}),c.access),
    h('div',{class:'crag-links'},
     h('a',{href:c.topo.url,target:'_blank',rel:'noopener noreferrer'},'Topo / guide source'),
     h('a',{href:c.officialFinder,target:'_blank',rel:'noopener noreferrer'},'Alpenverein finder'),
     h('button',{class:'exp',type:'button','aria-label':'Plan trip to '+c.name,onclick:(function(id){return function(){put('trip:crag',id);go('Trip planner');};})(c.id)},'Plan trip'),
     h('span',{class:'freshness',text:'Checked '+c.checked})
    )
   );
   grid.append(card);
  });
 }
 search.addEventListener('input',()=>{f.q=search.value.trim().toLowerCase();draw()});
 reg.addEventListener('change',()=>{f.region=reg.value;draw()});
 clu.addEventListener('change',()=>{f.cluster=clu.value;draw()});
 dis.addEventListener('change',()=>{f.disc=dis.value;draw()});
 draw();
};

V['Trip planner']=function(){
 const main=document.getElementById('main');
 main.append(
  h('h1',{text:'Trip planner'}),
  h('p',{class:'sub',text:'Assemble links for one objective: topo, access, weather, map, transport, overnight and emergency. This is a planning board, not live conditions or a booking system. Confirm every link against the official page on the day you travel.'})
 );
 main.append(h('aside',{class:'hub-emergency','aria-label':'Emergency numbers in Austria'},
  h('b',{text:'Emergency in Austria: '}),
  h('a',{href:'tel:140'},'Mountain rescue 140'),
  h('span',{text:'  |  '}),
  h('a',{href:'tel:112'},'EU emergency 112'),
  h('span',{class:'mini',text:'  Save these before your trip.'})
 ));

 const savedId=S['trip:crag']||'';
 const sel=h('select',{'aria-label':'Choose a starter area'});
 sel.append(h('option',{value:''},'— Select a starter crag or area —'));
 const byCluster={};
 CRAG_INDEX.forEach(function(c){
  if(!byCluster[c.cluster])byCluster[c.cluster]=[];
  byCluster[c.cluster].push(c);
 });
 Object.keys(byCluster).sort().forEach(function(cl){
  const og=h('optgroup',{label:cl});
  byCluster[cl].forEach(function(c){
   const o=h('option',{value:c.id},c.name+' ('+c.region+')');
   if(c.id===savedId)o.selected=true;
   og.append(o);
  });
  sel.append(og);
 });
 const clearBtn=h('button',{class:'exp',type:'button'},'Clear selection');
 const bar=h('div',{class:'trip-select-bar'},
  h('label',null,'Starter area from Crag index',sel),
  clearBtn
 );
 main.append(bar);

 const detail=h('div');
 main.append(detail);

 function linkRow(label,url,hint){
  if(!url)return h('li',{text:label+' — not listed'});
  return h('li',null,h('a',{href:url,target:'_blank',rel:'noopener noreferrer'},label),hint?h('span',{class:'mini',text:' — '+hint}):null);
 }
 function findSource(pred){
  for(let i=0;i<SOURCES.length;i++){if(pred(SOURCES[i]))return SOURCES[i];}
  return null;
 }
 function panel(title,nodes){
  const card=h('article',{class:'card trip-panel'});
  card.append(h('h3',{text:title}));
  nodes.forEach(function(n){if(n)card.append(n);});
  return card;
 }

 function draw(){
  detail.textContent='';
  const id=sel.value;
  put('trip:crag',id);
  if(!id){
   detail.append(
    h('p',{class:'mini',text:'Choose an area above, or open Crag index to browse first. Your selection is saved on this device with your other planner entries.'}),
    h('p',{class:'mini',text:'Tip: from Crag index, use “Plan trip” on a card to jump here with that area selected.'})
   );
   return;
  }
  const c=CRAG_INDEX.find(function(x){return x.id===id;});
  if(!c){detail.append(h('p',{text:'Unknown crag id.'}));return;}

  const isAlpine=/Alpine|Multi-pitch|Via ferrata|Ice/i.test((c.disciplines||[]).join(' '))||/cluster|Ötztal|Tannheimer|Vorarlberg|Kärnten|Rax/i.test(c.name+c.cluster);

  detail.append(
   h('h2',{text:c.name}),
   h('div',{class:'trip-meta'},
    h('span',{text:c.region}),
    h('span',{text:c.cluster}),
    h('span',{text:(c.disciplines||[]).join(' · ')}),
    c.rock?h('span',{text:c.rock}):null,
    c.grades?h('span',{text:c.grades}):null
   ),
   h('div',{class:'trip-access'},
    h('b',{text:'Access note (not a live closure feed): '}),
    h('span',{text:c.access||'Confirm with the local operator and on-site signs.'})
   )
  );

  const grid=h('div',{class:'trip-grid'});

  // Topo
  const topoUrl=c.topo&&c.topo.url;
  grid.append(panel('Topo & route plan',[
   h('ul',null,
    linkRow(c.topo&&c.topo.name||'Topo source',topoUrl,c.topo&&c.topo.kind),
    linkRow('Alpenverein area finder',c.officialFinder||'https://www.alpenverein.at/portal/wGlobal/content/finder/kletteranlagen.php','official directory; red outline may indicate shown closed'),
    linkRow('Climbers Paradise Tirol','https://www.climbers-paradise.com/en/','regional; mainly Tirol')
   ),
   h('p',{class:'mini',text:'Community and regional topos are not official access notices. Check the date on the page you open.'})
  ]));

  // Weather
  grid.append(panel('Weather & conditions',[
   h('ul',null,
    linkRow('Alpenverein mountain weather','https://www.alpenverein.at/portal/wetter/wetterlage.php','by alpine region'),
    linkRow('GeoSphere Austria weather portal','https://www.geosphere.at/en/maps/weather-portal','national maps'),
    isAlpine?linkRow('Lawinen.report','https://lawinen.report/','Tirol / Südtirol / Trentino bulletin'):null,
    isAlpine?linkRow('Avalanche services directory','https://lawine-steiermark.at/dienste/linksammlung','pick the federal-state service'):null
   ),
   h('p',{class:'mini',text:'Forecasts are not a guarantee that rock or snow is safe. Reassess on site.'})
  ]));

  // Map & travel
  grid.append(panel('Map, approach & transport',[
   h('p',{class:'mini',text:c.approach||''}),
   h('p',{class:'mini',text:c.transit||''}),
   h('ul',null,
    linkRow('BEV Austrian Map','https://maps.bev.gv.at/','official topo map'),
    linkRow('OeBB Scotty','https://www.oebb.at/en/fahrplan/fahrplanauskunft/scottymobil','public transport'),
    linkRow('EVIS.AT road information','https://evis.asfinag.at/Home','roadworks and closures')
   )
  ]));

  // Overnight
  grid.append(panel('Overnight & huts',[
   h('ul',null,
    linkRow('Hut Reservation (OHRS)','https://www.hut-reservation.org/login','book beds on participating club huts'),
    linkRow('Bettencheck','https://caa.alpenverein.at/service/bettencheck.html','multi-hut availability'),
    linkRow('Hüttenfinder','https://www.alpenverein.at/huetten','directory and contacts'),
    linkRow('Summer 2026 opening times','https://www.alpenverein.at/portal/huetten-wege/huettenoeffnungszeiten.php','planning baseline only')
   ),
   h('p',{class:'mini',text:'Not every hut is online. Confirm opening windows near travel time; cancel unused beds promptly.'})
  ]));

  // Safety
  grid.append(panel('Safety & organisations',[
   h('ul',null,
    linkRow('Austria emergency numbers','https://www.oesterreich.gv.at/en/themen/notfaelle_unfaelle_und_kriminalitaet/notrufnummern','140 mountain rescue · 112 EU'),
    linkRow('DEC112 accessible emergency app','https://www.dec112.at/en/app/','register before you need it'),
    linkRow('SicherAmBerg sport climbing','https://www.alpenverein.at/portal/bergsport/sicheramberg/sportklettern/index.php','club safety material'),
    linkRow('Climbing and nature (access etiquette)','https://www.alpenverein.at/portal/berg-aktiv/sportklettern/RuecksichtUndRespekt.php','stewardship guidance')
   )
  ]));

  // Notes from index
  if(c.notes||c.season||c.family){
   grid.append(panel('Area notes from Crag index',[
    c.season?h('p',null,h('b',{text:'Season: '}),c.season):null,
    c.family?h('p',null,h('b',{text:'Family / adaptive note: '}),c.family):null,
    c.notes?h('p',{text:c.notes}):null,
    h('p',{class:'mini',text:'Index checked field: '+(c.checked||'not set')+' — not a substitute for the live source page.'})
   ]));
  }

  detail.append(grid);

  // Checklist (same keys as Climbing Resources)
  const checklist=[
   {key:'hub:check:access',title:'Confirm access and closures',text:'Exact sector, approach, seasonal and wildlife restrictions, local signs.',url:c.officialFinder||'https://www.alpenverein.at/portal/wGlobal/content/finder/kletteranlagen.php',link:'Open Alpenverein finder'},
   {key:'hub:check:topo',title:'Read the route plan and descent',text:'Route, grade, length, protection, gear, approach and descent for this area.',url:topoUrl||'https://www.climbers-paradise.com/en/',link:'Open topo source'},
   {key:'hub:check:weather',title:'Check mountain weather and rock conditions',text:'Forecast at route elevation; rain, storms, wind, temperature, drying.',url:'https://www.alpenverein.at/portal/wetter/wetterlage.php',link:'Open mountain weather'},
   {key:'hub:check:travel',title:'Plan the approach, transport and daylight',text:'Parking or transit, approach time, last return, realistic turn-around.',url:'https://www.oebb.at/en/fahrplan/fahrplanauskunft/scottymobil',link:'Open OeBB Scotty'},
   {key:'hub:check:offline',title:'Prepare an offline backup',text:'Download topo and map; charged phone and power bank; share the plan.',url:'https://maps.bev.gv.at/',link:'Open BEV map'},
   {key:'hub:check:seasonal',title:'Check seasonal hazards',text:'Avalanche bulletin if snow terrain; storms, flooding, ice warnings.',url:'https://lawinen.report/',link:'Open Lawinen.report'},
   {key:'hub:check:emergency',title:'Set up the party and emergency plan',text:'Skills match objective; communication and what to do if separated.',url:'https://www.oesterreich.gv.at/en/themen/notfaelle_unfaelle_und_kriminalitaet/notrufnummern',link:'Emergency numbers'},
   {key:'hub:check:hut',title:'Confirm overnight beds if needed',text:'Opening dates and reservation on Hut Reservation or with the warden.',url:'https://www.hut-reservation.org/login',link:'Open Hut Reservation'}
  ];
  checklist.forEach(function(item){const suffix=String(item.key).split(':').pop(),active=getActiveTripPlan(),scope=active&&active.crag===id?active.id:'area-'+(id||'none');item.key='trip:check:'+scope+':'+suffix});
  const checklistBox=h('section',{class:'hub-block','aria-labelledby':'trip-check-title'});
  const progress=h('progress',{max:checklist.length,value:0,'aria-label':'Checklist completion'});
  const status=h('span',{class:'check-status','aria-live':'polite'});
  const reset=h('button',{class:'exp',type:'button'},'Reset checklist');
  const checkGrid=h('div',{class:'check-grid'});
  const checkInputs=[];
  function updateChecklist(){
   const done=checkInputs.filter(function(item){return item.input.checked;}).length;
   progress.value=done;
   status.textContent=done+' of '+checklist.length+' complete';
   reset.disabled=done===0;
  }
  checklist.forEach(function(item){
   const input=h('input',{type:'checkbox',checked:S[item.key]==='done'});
   input.setAttribute('aria-label',item.title);
   input.addEventListener('change',function(){put(item.key,input.checked?'done':'');updateChecklist();});
   checkInputs.push({input:input});
   const label=h('label',{class:'check-label'},input,
    h('span',null,h('b',{text:item.title}),h('span',{text:item.text})));
   checkGrid.append(h('div',{class:'check-row'},label,
    h('a',{href:item.url,target:'_blank',rel:'noopener noreferrer'},item.link)));
  });
  reset.addEventListener('click',function(){
   checkInputs.forEach(function(item){item.input.checked=false;});
   checklist.forEach(function(item){put(item.key,'');});
   updateChecklist();
  });
  checklistBox.append(
   h('h2',{id:'trip-check-title',text:'Before you go'}),
   h('p',{class:'mini',text:'Checklist ticks are saved for this area or named trip. The Climbing Resources checklist stays separate.'}),
   h('div',{class:'check-controls'},progress,status,reset),
   checkGrid
  );
  detail.append(checklistBox);
  updateChecklist();

  detail.append(h('p',{class:'mini hub-footnote',text:'Trip planner opens external official and regional sites. It does not scrape live free beds, closures or weather. Always follow the latest local access notice and the current forecast for your objective.'}));
 }

 sel.addEventListener('change',draw);
 clearBtn.addEventListener('click',function(){sel.value='';draw();});
 draw();
};

const trBeforeFieldDay=tr;
tr=function(v){return locale==='de'&&typeof v==='string'?(FIELD_DAY_DE[v]||trBeforeFieldDay(v)):trBeforeFieldDay(v)};
function fieldDayDateKey(){
 const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')
}
function fieldDayDateLabel(){
 return new Date().toLocaleDateString(locale==='de'?'de-AT':'en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})
}
function fieldDayJobs(place){
 return [
  {key:'access',title:'Confirm access and local notices',detail:'Check the official finder and signs at the crag. Community topos are not closure notices.',url:place.officialFinder||'https://www.alpenverein.at/portal/wGlobal/content/finder/kletteranlagen.php',link:'Finder'},
  {key:'topo',title:'Read route plan and descent',detail:place.topo&&place.topo.name?place.topo.name:'Current topo or guide for this area.',url:place.topo&&place.topo.url?place.topo.url:'https://www.climbers-paradise.com/en/',link:'Topo'},
  {key:'weather',title:'Check mountain weather',detail:'Forecast at route elevation; rain, wind and drying.',url:'https://www.alpenverein.at/portal/wetter/wetterlage.php',link:'Weather'},
  {key:'travel',title:'Plan approach and daylight',detail:place.transit||'Transit, approach time and last return.',url:'https://www.oebb.at/en/fahrplan/fahrplanauskunft/scottymobil',link:'Scotty'},
  {key:'offline',title:'Prepare offline backup',detail:'Download topo and map before signal drops.',url:'https://maps.bev.gv.at/',link:'BEV map'}
 ].slice(0,5)
}
function fieldDayScope(placeId){
 const active=getActiveTripPlan();
 return active&&active.crag===placeId?active.id:'area-'+placeId
}
function fieldDayCheckKey(placeId,suffix){return 'trip:check:'+fieldDayScope(placeId)+':'+suffix}
function fieldDayIsChecked(placeId,suffix){return S[fieldDayCheckKey(placeId,suffix)]==='done'}
function setFieldDayCheck(placeId,suffix,done){
 const k=fieldDayCheckKey(placeId,suffix);
 if(done)S[k]='done';else delete S[k];
 persist()
}
function fieldDayLibraryItems(){
 return [
  {label:'Events',detail:'Events and photo opportunities',tab:'Calendar'},
  {label:'Places',detail:'Outdoor areas and approach notes',tab:'Crag index'},
  {label:'Pitches',detail:'Pitch tracker and follow-ups',tab:'Pitch Tracker'},
  {label:'Sources',detail:'Planning and safety references',tab:'Sources & Contacts'},
  {label:'Calendar',detail:'Calendar and personal status',tab:'Calendar'},
  {label:'Gyms',detail:'Vienna gym directory',tab:'Gym Directory'},

 ]
}

   });

   if(!place){
    shell.append(h('div',{class:'field-panel field-empty'},h('h2',{text:'No place selected'}),h('p',{text:'Choose a place from the Crag index, or return to Studio to continue a topo preview.'}),h('button',{class:'field-primary',type:'button',onclick:function(){go('Crag index')}},'Pick from Atlas')));
   }else{
    const card=h('article',{class:'field-panel'});

     h('button',{class:'field-secondary',type:'button',onclick:function(){go('Crag index')}},'Open places index')

     list.append(h('article',{class:'field-library-row'},h('div',null,h('b',{text:item.label}),h('p',{text:item.detail})),h('button',{class:'field-secondary',type:'button',onclick:function(){go(item.tab)}},'Open')))

   const intro=h('p',{class:'field-small',text:'A shorter doorway into the existing hub library.'});

  }else if(!place){
   shell.append(h('div',{class:'field-panel field-empty'},h('h2',{text:'No place selected'}),h('p',{text:'Choose a place from the Crag index, or return to Studio to continue a topo preview.'}),h('div',{class:'field-actions'},
    h('button',{class:'field-primary',type:'button',onclick:function(){go('Crag index')}},'Pick from Atlas'),
    h('button',{class:'field-secondary',type:'button',onclick:function(){S['field:mode']='library';persist();draw()}},'Open library')
   )));

    h('span',{class:'field-place-meta'},tr('Checklist scope')+': '+scopeLabel)
   );
   const cells=[
    {label:'Access',key:'access',todo:'Check finder'},
    {label:'Weather',key:'weather',todo:'Open forecast'},

     h('a',{href:job.url,target:'_blank',rel:'noopener noreferrer'},job.link)

   });

   const actions=h('div',{class:'field-quick'});

    h('button',{type:'button',onclick:function(){S['field:mode']='studio';S['field:summaryOpen']=false;persist();draw()}},h('span',{class:'field-quick-icon'},'◎'),'Wall'),

   );
   quick.append(actions);
   const dayKey='field:log:'+place.id+':'+fieldDayDateKey();

    h('option',{value:'No photos today',selected:savedLog.status==='No photos today'},'No photos today')
   ]);
   const notes=h('textarea',{class:'field-notes',placeholder:'Light, positions, media rules, parking…','aria-label':'Day notes'},S['field:notes']||'');
   statusSelect.addEventListener('change',function(){const next=Object.assign({},S[dayKey]||{});next.status=statusSelect.value;S[dayKey]=next;persist()});
   notes.addEventListener('input',function(){S['field:notes']=notes.value;persist()});
   const log=h('section',{class:'field-panel','aria-labelledby':'field-log-title'},
    h('h2',{id:'field-log-title',text:'Photo / session log'}),

    h('label',null,h('span',{class:'field-small',text:'Day notes'}),notes)
   );
   const safety=h('p',{class:'field-alert'},tr('Weather and map links are planning references, not a safety guarantee.'),' ',

    ' · ',h('a',{href:'https://www.oesterreich.gv.at/en/themen/notfaelle_unfaelle_und_kriminalitaet/notrufnummern',target:'_blank',rel:'noopener noreferrer'},'Emergency numbers')

     S['field:lastSummaryData']={date:fieldDayDateLabel(),placeId:place.id,placeName:place.name,done:done,total:5,shotStatus:(S[dayKey]||{}).status||'',notes:S['field:notes']||'',jobs:jobs.map(function(j){return{title:j.title,done:fieldDayIsChecked(place.id,j.key)}})};
