  <path class="route" d="M575 817 C580 725 585 610 600 430"/><path class="route" d="M615 817 C620 720 635 615 650 412"/>
  <path class="route shared" d="M655 820 C660 730 675 630 690 452"/><path class="route" d="M700 818 C705 720 720 615 735 432"/>
  <path class="route" d="M742 818 C750 725 765 620 780 430"/><path class="route" d="M785 820 C790 730 805 630 825 465"/>
  <path class="route" d="M830 820 C838 725 845 620 855 455"/><path class="route" d="M872 820 C880 730 890 625 900 470"/>
  <path class="route" d="M914 820 C920 730 935 625 945 470"/><path class="route" d="M955 820 C960 730 972 625 980 485"/>
  <path class="route" d="M995 820 C1000 735 1010 640 1025 495"/>

