  <path class="route" d="M1035 820 C1040 730 1055 635 1068 485"/><path class="route" d="M1075 820 C1085 730 1095 630 1110 465"/>
  <path class="route" d="M1118 820 C1120 735 1138 640 1150 470"/><path class="route" d="M1160 820 C1170 730 1185 635 1200 470"/>
  <path class="route" d="M1205 820 C1210 730 1230 635 1245 490"/><path class="route" d="M1248 820 C1250 730 1270 640 1288 490"/>
  <path class="route" d="M1290 820 C1300 730 1315 650 1330 510"/><path class="route" d="M1330 820 C1340 735 1355 650 1370 520"/>
  <path class="route" d="M1370 820 C1380 735 1395 650 1410 520"/><path class="route" d="M1410 820 C1420 740 1430 655 1440 530"/>
  <path class="route" d="M1450 820 C1458 740 1465 655 1470 540"/>
  <path class="route shared" d="M1370 865 C1380 760 1390 650 1400 545"/>
  <path class="route" d="M1410 865 C1420 760 1430 660 1440 555"/>
  <path class="route" d="M1450 865 C1460 760 1470 665 1480 565"/>
  <path class="route" d="M1490 865 C1495 765 1500 670 1505 575"/>

