<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="1024" viewBox="0 0 1536 1024">
  <title>Jammerwand provisional route overlay v1</title>
  <desc>Concept-only route overlay retaining the historic numbers 1 to 37. Route paths, equipment, lengths and French conversions require on-site verification.</desc>
  <image x="0" y="0" width="1536" height="1024" xlink:href="jammerwand-topo-base-concept-v1.png"/>
  <style>
    .route { fill:none; stroke:#bd4c56; stroke-width:3.5; stroke-dasharray:10 8; stroke-linecap:round; stroke-linejoin:round; opacity:.95 }
    .route.shared { stroke:#d98547; }
    .dot { fill:#123f36; stroke:#fffdf5; stroke-width:3 }
    .n { fill:#fffdf5; font:700 16px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle }
    .panel { fill:#113b33; opacity:.94 }
    .title { fill:#fffdf5; font:700 25px Arial, sans-serif; letter-spacing:1px }
    .sub { fill:#dce9e3; font:15px Arial, sans-serif }
    .warning { fill:#8a312f; font:700 14px Arial, sans-serif; letter-spacing:.4px }
    .sector { fill:#fffdf5; stroke:#123f36; stroke-width:3 }
    .sectorText { fill:#123f36; font:700 16px Arial, sans-serif; text-anchor:middle; dominant-baseline:middle }
  </style>
  <rect class="panel" x="30" y="28" width="500" height="88" rx="12"/>
  <text class="title" x="54" y="62">JAMMERWAND</text>
  <text class="sub" x="54" y="88">Provisional route overlay · original numbering retained</text>
  <rect x="1055" y="30" width="450" height="47" rx="9" fill="#fff9ef" opacity=".96"/>
  <text class="warning" x="1080" y="60">CONCEPT ONLY — VERIFY LINES, BOLTS &amp; GRADES ON SITE</text>

  <!-- sector markers -->
  <circle class="sector" cx="245" cy="430" r="19"/><text class="sectorText" x="245" y="430">A</text>
  <circle class="sector" cx="715" cy="410" r="19"/><text class="sectorText" x="715" y="410">B</text>
  <circle class="sector" cx="1170" cy="440" r="19"/><text class="sectorText" x="1170" y="440">C</text>

  <!-- 1–11: left sector -->
  <path class="route" d="M155 780 C150 685 157 580 170 465"/><path class="route" d="M185 785 C180 690 192 575 205 430"/>
  <path class="route" d="M218 790 C220 690 225 590 232 425"/><path class="route" d="M250 795 C252 690 267 585 275 405"/>
  <path class="route" d="M285 800 C290 700 300 600 320 420"/><path class="route" d="M323 804 C330 700 340 585 352 405"/>
  <path class="route" d="M360 808 C365 710 372 615 382 435"/><path class="route" d="M398 810 C402 720 405 620 422 450"/>
  <path class="route" d="M438 810 C440 700 452 598 470 430"/><path class="route" d="M478 814 C486 710 500 600 518 430"/>
  <path class="route" d="M518 815 C525 720 542 620 553 470"/>

