  <g>
    <circle class="dot" cx="155" cy="780" r="16"/><text class="n" x="155" y="780">1</text><circle class="dot" cx="185" cy="785" r="16"/><text class="n" x="185" y="785">2</text><circle class="dot" cx="218" cy="790" r="16"/><text class="n" x="218" y="790">3</text><circle class="dot" cx="250" cy="795" r="16"/><text class="n" x="250" y="795">4</text><circle class="dot" cx="285" cy="800" r="16"/><text class="n" x="285" y="800">5</text><circle class="dot" cx="323" cy="804" r="16"/><text class="n" x="323" y="804">6</text><circle class="dot" cx="360" cy="808" r="16"/><text class="n" x="360" y="808">7</text><circle class="dot" cx="398" cy="810" r="16"/><text class="n" x="398" y="810">8</text><circle class="dot" cx="438" cy="810" r="16"/><text class="n" x="438" y="810">9</text><circle class="dot" cx="478" cy="814" r="16"/><text class="n" x="478" y="814">10</text><circle class="dot" cx="518" cy="815" r="16"/><text class="n" x="518" y="815">11</text>
    <circle class="dot" cx="575" cy="817" r="16"/><text class="n" x="575" y="817">12</text><circle class="dot" cx="615" cy="817" r="16"/><text class="n" x="615" y="817">13</text><circle class="dot" cx="655" cy="820" r="16"/><text class="n" x="655" y="820">14</text><circle class="dot" cx="700" cy="818" r="16"/><text class="n" x="700" y="818">15</text><circle class="dot" cx="742" cy="818" r="16"/><text class="n" x="742" y="818">16</text><circle class="dot" cx="785" cy="820" r="16"/><text class="n" x="785" y="820">17</text><circle class="dot" cx="830" cy="820" r="16"/><text class="n" x="830" y="820">18</text><circle class="dot" cx="872" cy="820" r="16"/><text class="n" x="872" y="820">19</text><circle class="dot" cx="914" cy="820" r="16"/><text class="n" x="914" y="820">20</text><circle class="dot" cx="955" cy="820" r="16"/><text class="n" x="955" y="820">21</text><circle class="dot" cx="995" cy="820" r="16"/><text class="n" x="995" y="820">22</text>
    <circle class="dot" cx="1035" cy="820" r="16"/><text class="n" x="1035" y="820">23</text><circle class="dot" cx="1075" cy="820" r="16"/><text class="n" x="1075" y="820">24</text><circle class="dot" cx="1118" cy="820" r="16"/><text class="n" x="1118" y="820">25</text><circle class="dot" cx="1160" cy="820" r="16"/><text class="n" x="1160" y="820">26</text><circle class="dot" cx="1205" cy="820" r="16"/><text class="n" x="1205" y="820">27</text><circle class="dot" cx="1248" cy="820" r="16"/><text class="n" x="1248" y="820">28</text><circle class="dot" cx="1290" cy="820" r="16"/><text class="n" x="1290" y="820">29</text><circle class="dot" cx="1330" cy="820" r="16"/><text class="n" x="1330" y="820">30</text><circle class="dot" cx="1370" cy="820" r="16"/><text class="n" x="1370" y="820">31</text><circle class="dot" cx="1410" cy="820" r="16"/><text class="n" x="1410" y="820">32</text><circle class="dot" cx="1450" cy="820" r="16"/><text class="n" x="1450" y="820">33</text>
  </g>
  <!-- 34–37 are the continuation/right-edge routes, intentionally offset to avoid crowding -->
  <g><circle class="dot" cx="1370" cy="865" r="16"/><text class="n" x="1370" y="865">34</text><circle class="dot" cx="1410" cy="865" r="16"/><text class="n" x="1410" y="865">35</text><circle class="dot" cx="1450" cy="865" r="16"/><text class="n" x="1450" y="865">36</text><circle class="dot" cx="1490" cy="865" r="16"/><text class="n" x="1490" y="865">37</text></g>
  <rect x="30" y="930" width="1476" height="62" rx="10" fill="#fff9ef" opacity=".93"/>
  <text class="sub" x="55" y="958" fill="#113b33">Linework is a visual draft derived from an historic topo and oblique drone imagery.</text>
  <text class="sub" x="55" y="980" fill="#113b33">Use only after field verification; route identity, starts, finishes, bolts, lengths, anchors and grade conversions are not confirmed.</text>
</svg>
