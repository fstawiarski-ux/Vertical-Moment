<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vertical Moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>:root{
  --paper:#EFE7D8; --surface:rgba(255,255,255,.74); --surface-strong:#FBF7EE;
  --ink:#22342A; --forest:#22342A; --muted:#5E6E52; --line:#D9CDB8;
  --terra:#BF6B4F; --gold:#D89A34; --sage:#93A382; --chalk:#F2ECE0;
  --success:#2C7A53; --warning:#B17822; --danger:#B94A48;
  --shadow:0 22px 60px rgba(20,32,24,.10);
  --disp:"Fraunces","Iowan Old Style",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
[data-theme="dark"]{
  --paper:#141A12; --surface:rgba(32,44,33,.82); --surface-strong:#1B251E;
  --ink:#EDF2E7; --forest:#1B251E; --muted:#A8B3AA; --line:rgba(255,255,255,.12);
  --terra:#D98A63; --gold:#E4B45A; --sage:#A8B3AA; --chalk:#F2ECE0;
  --shadow:0 24px 64px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html,body{padding:0;margin:0}
body{font-family:var(--body);color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 8% -5%,rgba(191,107,79,.14),transparent 34rem),
             radial-gradient(circle at 100% 0,rgba(34,52,42,.10),transparent 30rem),var(--paper);}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.02em;margin:0}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{width:min(1200px,calc(100% - 32px));margin:0 auto}
.muted{color:var(--muted)}
.serif{font-family:var(--disp)}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--terra)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:.28rem .6rem;font-size:12px;color:var(--muted);background:rgba(255,255,255,.14)}
.btn{border:0;border-radius:999px;padding:.62rem .95rem;font-weight:700;display:inline-flex;align-items:center;gap:.4rem;justify-content:center}
.btn-terra{background:var(--terra);color:#fff}
.btn-forest{background:var(--forest);color:var(--chalk)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* header */
.site-head{position:sticky;top:0;z-index:1000;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(16px)}
.site-head .row{display:flex;align-items:center;gap:16px;min-height:64px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .vm{font-family:var(--disp);font-weight:900;font-size:24px;letter-spacing:1px}
.brand .sub{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:6px}
.nav a{color:var(--muted);font-weight:600;padding:8px 13px;border-radius:999px;font-size:14px}
.nav a.on{background:var(--forest);color:var(--chalk)}
.spacer{margin-left:auto}
.who{font-size:13px;font-weight:600}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}

/* generic layout */
section.view{padding:24px 0 90px}
.count{font-size:13px;color:var(--muted);margin:4px 2px 10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:.6rem .8rem;font-size:14px}
[data-theme="dark"] .search{background:#0f140d}
.sel{border:1px solid var(--line);background:transparent;border-radius:12px;padding:.55rem .7rem;font-size:13.5px}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:.45rem .8rem;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--gold);color:#2b2b28;border-color:var(--gold)}

/* map front page */
.hero{padding:22px 0 8px}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1}
.hero p{color:var(--muted);max-width:640px;margin:12px 0 0;line-height:1.55}
.mapgrid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px;margin-top:16px}
#map{height:588px;border-radius:16px;border:1px solid var(--ink);overflow:hidden;z-index:0;background:#E7DECB}
.panel{background:var(--forest);color:var(--chalk);border-radius:16px;padding:14px 14px 8px;display:flex;flex-direction:column;min-height:0;max-height:588px}
.panel-head{display:flex;align-items:center;gap:8px;padding:0 2px 10px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.panel-head h2{font-size:15px;letter-spacing:.5px;flex:1;color:var(--chalk)}
.crumb{background:none;border:0;color:var(--gold);cursor:pointer;font-weight:600;font-size:12.5px;padding:2px 4px}
.pcount{font-size:11.5px;color:var(--sage)}
.plist{overflow:auto;display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;border:0;background:none;color:var(--chalk);cursor:pointer;text-align:left;width:100%;font-size:13.5px}
.prow:hover{background:rgba(255,255,255,.07)}
.prow .rdot{width:9px;height:9px;border-radius:50%;flex:none}
.prow .rname{flex:1;font-weight:600}
.prow .rmeta{font-size:11.5px;color:var(--sage)}
.prow.route{cursor:default}
.prow.route:hover{background:none}
.g-dot{background:var(--gold)} .s-dot{background:var(--sage)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}

/* leaflet popup theming */
.leaflet-popup-content-wrapper{background:var(--forest);color:var(--chalk);border-radius:11px}
.leaflet-popup-tip{background:var(--forest)}
.leaflet-popup-content{margin:11px 13px;font-family:var(--body);min-width:180px}
.leaflet-popup-content a{color:var(--gold);font-weight:600}
.vm-vienna{display:grid;place-items:center;width:34px;height:34px}
.vm-vienna span{font-family:var(--disp);font-weight:900;font-size:12px;color:var(--ink);background:var(--chalk);border:2px solid var(--ink);border-radius:50%;width:34px;height:34px;display:grid;place-items:center}

/* stat line */
.statline{display:flex;gap:8px 22px;flex-wrap:wrap;align-items:baseline;margin:14px 0 0;font-size:13px;color:var(--muted)}
.statline b{font-family:var(--disp);font-weight:600;font-size:19px;color:var(--ink)}

/* tables (explore) */
.subtabs{display:flex;gap:6px;margin-bottom:14px}
.subtab{border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;border-radius:999px;padding:7px 15px;font-size:13.5px}
.subtab.on{background:var(--forest);color:var(--chalk);border-color:var(--forest)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--forest);color:var(--chalk);font-weight:600;font-size:12px;letter-spacing:.03em;cursor:pointer;user-select:none}
th .arrow{opacity:.5;font-size:10px}
tbody tr:hover{background:color-mix(in srgb,var(--gold) 8%,transparent)}
.g{font-family:var(--disp);font-weight:600}
.band{font-size:11.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;vertical-align:middle}
.gps-present{background:var(--success)}.gps-approx{background:var(--gold)}.gps-missing{background:var(--danger)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.crag{padding:16px}.crag h3{font-size:18px}
.crag .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.crag a{color:var(--terra);font-weight:600;font-size:12.5px;margin-right:12px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:.24rem .55rem;font-size:11.5px;font-weight:700;border:1px solid var(--line)}
.badge.guide{background:color-mix(in srgb,var(--gold) 22%,transparent);border-color:var(--gold);color:#7a5a12}
[data-theme="dark"] .badge.guide{color:var(--gold)}
.badge.osm{color:var(--sage)}

/* contribute */
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.mission{padding:18px}
.mission .top{display:flex;justify-content:space-between;gap:10px}
.mission h3{font-size:20px;margin:8px 0 2px}
.needs{list-style:none;margin:12px 0;padding:0;display:grid;gap:5px}
.needs li{font-size:13px;padding-left:15px;position:relative}
.needs li::before{content:"›";position:absolute;left:2px;color:var(--terra);font-weight:900}
.prio{border-radius:999px;padding:.24rem .55rem;font-size:11.5px;font-weight:700;text-transform:capitalize;border:1px solid var(--line)}
.prio.urgent{background:var(--danger);color:#fff;border-color:transparent}
.prio.high{color:var(--terra);border-color:color-mix(in srgb,var(--terra) 40%,var(--line))}
.progress{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--terra)}
.mfoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.brief{padding:18px;margin:14px 0}.brief p{margin:0 0 10px;line-height:1.55}
.chipline{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.needs2{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}.needs2 li{font-size:13.5px}
.blockh{margin:24px 0 12px}
.checklist{display:grid;gap:11px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:15px;padding:13px;background:color-mix(in srgb,var(--surface-strong) 65%,transparent)}
.check input[type=checkbox]{width:20px;height:20px;accent-color:var(--terra);margin-top:2px}
.check .body strong{font-size:14.5px}
.check textarea{margin-top:8px;width:100%;min-height:60px;border:1px solid var(--line);border-radius:11px;padding:9px;background:transparent;resize:vertical}
.req{color:var(--terra)}
.evi{padding:18px}
.drop{border:1.5px dashed var(--line);border-radius:18px;padding:26px;text-align:center;cursor:pointer;transition:.15s}
.drop:hover{border-color:var(--terra);background:color-mix(in srgb,var(--terra) 6%,transparent)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;margin-top:14px}
.file{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface-strong)}
.file img{width:100%;height:96px;object-fit:cover;display:block}
.file .ic{height:96px;display:grid;place-items:center;font-weight:900;color:var(--muted);letter-spacing:.08em;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.file .fm{padding:9px}.file .fn{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .cap{margin-top:5px;width:100%;border:1px solid var(--line);border-radius:9px;padding:5px 7px;font-size:12px;background:transparent}
.file .rm{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(18,25,20,.72);color:#fff;font-size:15px;line-height:1}
.gen{width:100%;min-height:88px;border:1px solid var(--line);border-radius:13px;padding:11px;background:transparent;margin-top:14px;resize:vertical}
.trust{padding:18px;margin-top:16px;display:grid;gap:16px}
.field{display:grid;gap:7px}.flabel{font-weight:700;font-size:14px}
.conf{display:flex;gap:7px}
.confd{width:42px;height:42px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700}
.confd.on{background:var(--terra);color:#fff;border-color:transparent}
.safety{display:flex;gap:11px;align-items:flex-start}
.safety input{width:20px;height:20px;margin-top:2px;accent-color:var(--warning)}
.submitbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.done{text-align:center;padding:34px 12px;display:grid;gap:14px;justify-items:center}

footer{border-top:1px solid var(--line);padding:16px 0;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}

@media(max-width:820px){
  .mapgrid{grid-template-columns:1fr}
  #map{height:420px}.panel{max-height:none}
  .cgrid,.mgrid{grid-template-columns:1fr}
  .brand .sub{display:none}
}
</style>
<style>
/* ---- overrides + new components (loaded after globals) ---- */
.hero{padding:22px 0 12px}
.hero h1{font-size:clamp(24px,3.4vw,38px);line-height:1.08;margin:6px 0 8px}
.hero p{font-size:14.5px;max-width:600px}
.statline{margin-top:12px;font-size:13px;gap:16px}
.mapgrid{display:grid;grid-template-columns:1fr 292px;gap:16px;align-items:stretch}
#map{height:62vh;min-height:400px;border-radius:14px;z-index:0}
.panel{width:auto;display:flex;flex-direction:column;min-height:0;max-height:62vh}
.tree{overflow:auto;flex:1;padding:4px}
.trow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;border:0;background:transparent;
  cursor:pointer;padding:5px 8px;border-radius:8px;color:var(--ink);font:inherit;font-size:12.7px;line-height:1.25}
.trow:hover{background:var(--hover,rgba(0,0,0,.05))}
.trow .tw{width:12px;flex:0 0 12px;text-align:center;color:var(--sage);font-size:11px}
.trow .tlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tcount{font-size:11px;color:var(--sage);font-variant-numeric:tabular-nums}
.trow.lvl1{font-weight:600;font-size:13px}
.trow.lvl1.open{color:var(--terra)}
.tnode.l2{margin-left:12px;border-left:1px solid var(--line,rgba(0,0,0,.08))}
.trow.lvl2{padding-left:8px}
.trow.lvl3{margin-left:22px;font-size:12.2px;color:var(--muted,#5b6b60)}
.trow.lvl3 .tgrade{font-family:var(--mono,ui-monospace,monospace);font-size:11.5px;color:var(--chalk,var(--terra))}
.cdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.cdot.g{background:var(--gold)} .cdot.s{background:var(--sage)}
.rdot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:#bbb}
.rdot.gps-present{background:#3f9d5a}.rdot.gps-approx{background:var(--gold)}.rdot.gps-missing{background:#c98a8a}
.tnote{margin-left:22px;padding:6px 8px 10px;font-size:11.8px;color:var(--sage);line-height:1.35}
.panel-head{padding:10px 12px 8px;border-bottom:1px solid var(--line,rgba(0,0,0,.08))}
.panel-head h2{font-size:13px;letter-spacing:.14em;margin:0}
.panel-head .pcount{font-size:11px;color:var(--sage)}
/* explore divider */
.explore-divider{margin:26px 0 14px;padding-top:22px;border-top:1px solid var(--line,rgba(0,0,0,.1))}
.explore-divider h2{font-family:var(--serif,'Fraunces',serif);font-size:clamp(22px,3vw,30px);margin:0 0 4px}
#view-explore-inner .eyebrow,#view-explore-inner h1{display:none} /* trim old page header if present */
table tbody tr{cursor:pointer}
/* route modal */
#route-modal{position:fixed;inset:0;background:rgba(20,26,22,.55);display:none;align-items:center;justify-content:center;
  z-index:1200;padding:18px}
#route-modal.on{display:flex}
.rm-card{background:var(--card,#fff);color:var(--ink);border-radius:16px;max-width:440px;width:100%;
  padding:22px 22px 18px;box-shadow:0 24px 70px rgba(0,0,0,.3);position:relative;max-height:88vh;overflow:auto}
.rm-x{position:absolute;top:12px;right:14px;border:0;background:transparent;font-size:24px;line-height:1;
  cursor:pointer;color:var(--sage)}
.rm-card h2{font-family:var(--serif,'Fraunces',serif);font-size:26px;margin:2px 0 6px}
.rm-grade{font-size:20px;font-weight:600;color:var(--terra);margin-bottom:12px}
.rm-grade small{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
.rm-dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0 0 14px}
.rm-dl div{border-bottom:1px solid var(--line,rgba(0,0,0,.07));padding-bottom:6px}
.rm-dl dt{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.rm-dl dd{margin:2px 0 0;font-size:14px}
.rm-act{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.rm-foot{font-size:12px;margin:0}
.leaflet-control-layers{font-size:12.5px;border-radius:10px}
[data-theme="light"]{--muted:#47563F;--card:#FBF7EE;--hover:rgba(34,52,42,.06)}
[data-theme="dark"]{--card:#1B251E;--hover:rgba(255,255,255,.06)}
.rm-card{color:var(--ink)} .rm-card .muted{color:var(--muted)}
.rm-photo{height:120px;border-radius:12px;border:1px dashed var(--line);margin-bottom:14px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(0,0,0,.035) 10px,rgba(0,0,0,.035) 20px)}
.rm-photo span{font-size:12px;color:var(--muted);letter-spacing:.04em}
.crag-photo{height:104px;border-radius:12px;border:1px dashed var(--line);margin-bottom:12px;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(0,0,0,.035) 10px,rgba(0,0,0,.035) 20px)}
.crag-photo span{font-size:11.5px;color:var(--muted);letter-spacing:.05em}
.areabar{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.areabtn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:.42rem .85rem;font-weight:600;font-size:13px;cursor:pointer}
.areabtn:hover{border-color:var(--terra)}
.areabtn.on{background:var(--forest);color:var(--chalk);border-color:var(--forest)}
.vm-coord{background:color-mix(in srgb,var(--paper) 90%,transparent);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums;margin:8px}
.vm-measure{background:var(--surface-strong);overflow:hidden}
.vm-measure a{font-size:15px;line-height:26px;width:28px;text-align:center;color:var(--ink);display:block}
.vm-measure.on a{background:var(--terra);color:#fff}
.vm-mbox{padding:5px 8px;font-size:12px;color:var(--ink);border-top:1px solid var(--line);min-width:150px;background:var(--surface-strong)}
@media(max-width:820px){.mapgrid{grid-template-columns:1fr}#map{height:52vh}.panel{max-height:340px}.rm-dl{grid-template-columns:1fr}}
</style>
</head>

  <a class="brand" href="#" data-nav="map"><span class="vm">V<span style="color:var(--terra)">M</span></span>
    <span><span class="serif" style="font-weight:600;font-size:15px">VERTICAL MOMENT</span><br>
      <span class="sub">Kletterreviere · Wien &amp; NÖ</span></span></a>
  <nav class="nav">
    <a href="#" class="on" data-nav="map">Map</a>

  </nav>

  <span class="who">Ambassador</span>

</div></header>

function hav(a,b){const R=6371,r=Math.PI/180,dLa=(b.lat-a.lat)*r,dLo=(b.lng-a.lng)*r;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLa/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2));}
function addMapTools(){
  const Coord=L.Control.extend({options:{position:'bottomleft'},onAdd:function(){
    const d=L.DomUtil.create('div','vm-coord');d.innerHTML='move over the map…';
    LMAP.on('mousemove',e=>{d.innerHTML=e.latlng.lat.toFixed(5)+', '+e.latlng.lng.toFixed(5);});return d;}});
  LMAP.addControl(new Coord());
  let on=false,pts=[],layer=L.layerGroup().addTo(LMAP),box;
  const fmt=k=>k<1?Math.round(k*1000)+' m':k.toFixed(2)+' km';
  const total=()=>{let s=0;for(let i=1;i<pts.length;i++)s+=hav(pts[i-1],pts[i]);return s;};
  function redraw(){layer.clearLayers();if(pts.length>1)L.polyline(pts,{color:'#BF6B4F',weight:3,dashArray:'5 5'}).addTo(layer);
    pts.forEach(p=>L.circleMarker(p,{radius:4,color:'#BF6B4F',fillColor:'#fff',fillOpacity:1,weight:2}).addTo(layer));
    if(box)box.innerHTML=pts.length<2?'Click points on the map':('Distance: '+fmt(total())+' · '+pts.length+' pts');}
  const onClick=e=>{pts.push(e.latlng);redraw();};
  const Measure=L.Control.extend({options:{position:'topleft'},onAdd:function(){
    const wrap=L.DomUtil.create('div','leaflet-bar vm-measure');
    const b=L.DomUtil.create('a','',wrap);b.href='#';b.title='Measure distance';b.innerHTML='&#128207;';
    box=L.DomUtil.create('div','vm-mbox',wrap);box.style.display='none';box.innerHTML='Click points on the map';
    L.DomEvent.on(b,'click',ev=>{L.DomEvent.stop(ev);on=!on;wrap.classList.toggle('on',on);box.style.display=on?'block':'none';
      if(on){LMAP.on('click',onClick);}else{LMAP.off('click',onClick);pts=[];layer.clearLayers();}});
    return wrap;}});
  LMAP.addControl(new Measure());
}
function popup(c){const links=[];if(c.web)links.push(`<a href="${esc(c.web)}" target="_blank" rel="noopener">Website</a>`);
  if(c.topo)links.push(`<a href="${esc(c.topo)}" target="_blank" rel="noopener">Topo</a>`);
  if(c.osm)links.push(`<a href="https://www.openstreetmap.org/${esc(c.osm)}" target="_blank" rel="noopener">OSM</a>`);
  return `<strong>${esc(c.n)}</strong><br>${km(c.la,c.lo)} km from Wien · ${(c.gbr||c.rc||0)} routes<br>${c.db?'In guidebook':'OSM extra'}<br>${links.join(' · ')}`;}
function drawMarkers(){
  LLAYER.clearLayers();const pts=[];
  CRAGS.forEach(c=>{if(c.la==null)return;pts.push([c.la,c.lo]);
    const mk=L.circleMarker([c.la,c.lo],{radius:6,weight:1.5,color:'#F2ECE0',fillColor:c.db?GOLD:SAGE,fillOpacity:.95});
    mk.on('click',()=>{if(c.r[0])expReg.add(c.r[0]);if(c.routes.length)expCrag.add(c.n);drawTree();LMAP.setView([c.la,c.lo],14);mk.bindPopup(popup(c)).openPopup();
      const row=document.querySelector('[data-crag="'+cssEsc(c.n)+'"]');if(row)row.scrollIntoView({block:'center'});});
    mk.addTo(LLAYER);cragMarkers[c.n]=mk;});
  if(pts.length)LMAP.fitBounds(L.latLngBounds(pts.concat([VIENNA])),{padding:[24,24],maxZoom:11});
}
function cssEsc(s){return String(s).replace(/["\\]/g,'\\$&');}
function drawTree(){
  const host=$('tree');if(!host)return;
  host.innerHTML=regions.map(rg=>{
    const open=expReg.has(rg.name);
    const inner=open?cragsByRegion(rg.name).map(c=>{
      const co=expCrag.has(c.n),rc=c.gbr||c.rc||0;
      const routes=co?(c.routes.length?c.routes.map(r=>
        `<button class="trow lvl3" data-route="${esc(c.n)}\u241f${esc(r.n)}"><span class="rdot ${gpDot(r.gp)}" title="${esc(r.gp)}"></span>
          <span class="tlabel">${esc(r.n)}</span><span class="tgrade">${esc(r.g)}</span></button>`).join('')
        :`<div class="tnote">No catalogued routes yet — from OpenStreetMap. A contributor mission can transcribe them.</div>`):'';
      return `<div class="tnode l2"><button class="trow lvl2 ${co?'open':''}" data-crag="${esc(c.n)}">
        <span class="tw">${c.routes.length?(co?'▾':'▸'):'·'}</span><span class="cdot ${c.db?'g':'s'}"></span>
        <span class="tlabel">${esc(c.n)}</span><span class="tcount">${rc||'—'}</span></button>${routes}</div>`;
    }).join(''):'';
    return `<div class="tnode"><button class="trow lvl1 ${open?'open':''}" data-reg="${esc(rg.name)}">
      <span class="tw">${open?'▾':'▸'}</span><span class="tlabel">${esc(rg.name)}</span><span class="tcount">${rg.count}</span></button>${inner}</div>`;
  }).join('');
  host.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{const n=b.dataset.reg;expReg.has(n)?expReg.delete(n):expReg.add(n);drawTree();});
  host.querySelectorAll('[data-crag]').forEach(b=>b.onclick=()=>{const n=b.dataset.crag,c=CRAGS.find(x=>x.n===n);
    if(c.routes.length){expCrag.has(n)?expCrag.delete(n):expCrag.add(n);}drawTree();
    if(mapBuilt&&c.la!=null){LMAP.setView([c.la,c.lo],14);if(cragMarkers[n])cragMarkers[n].bindPopup(popup(c)).openPopup();}});
  host.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>{const [cn,rn]=b.dataset.route.split('\u241f');openRouteByName(rn,cn);});
}

/* ---- route detail ---- */
function openRouteByName(rn,cn){
  const c=CRAGS.find(x=>x.n===cn);
  const full=ROUTES.find(r=>r.n===rn&&(r.cr===cn||r.w===cn))||ROUTES.find(r=>r.n===rn);
  const base=(c&&c.routes.find(r=>r.n===rn))||{};
  openRoute(Object.assign({},base,full||{},{cr:(full&&full.cr)||cn}));
}
function openRoute(r){
  const hasGps=r.la!=null&&r.lo!=null;
  const rows=[
    ['Grade',r.g],['Grade band',r.gb],['Discipline',r.d],
    ['Region',r.rg],['Area',r.a],['Crag',r.cr],['Wall',r.w],
    ['Coordinates',hasGps?(r.la.toFixed(6)+', '+r.lo.toFixed(6)):null],
    ['From Wien',hasGps?(km(r.la,r.lo)+' km'):null],
    ['GPS status',r.gp]
  ].filter(x=>x[1]!=null&&x[1]!=='');
  $('route-modal').innerHTML=`<div class="rm-card"><button class="rm-x" id="rm-x" aria-label="Close">×</button>
    <div class="rm-photo"><span>Crag photo — added from the field</span></div>
    <div class="eyebrow">${esc(r.d||'route')}</div><h2>${esc(r.n)}</h2>
    <div class="rm-grade">${esc(r.g||'—')}<small>${esc(r.gb||'')}</small></div>
    <dl class="rm-dl">${rows.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}
      ${hasGps?`<div><dt>Elevation</dt><dd id="rm-elev">checking…</dd></div>`:''}</dl>
    ${hasGps?`<div class="rm-act"><button class="btn btn-terra" id="rm-map">Show on map</button>
      <a class="btn btn-ghost" href="https://www.openstreetmap.org/?mlat=${r.la}&mlon=${r.lo}#map=17/${r.la}/${r.lo}" target="_blank" rel="noopener">Open in OSM</a></div>`:''}
    <p class="rm-foot muted">Approach, description and photos appear here once this route is documented in the field.</p></div>`;
  $('route-modal').classList.add('on');
  $('rm-x').onclick=closeRoute;
  $('route-modal').onclick=e=>{if(e.target.id==='route-modal')closeRoute();};
  const rm=$('rm-map');if(rm)rm.onclick=()=>{closeRoute();show('browse');window.scrollTo({top:0,behavior:'smooth'});if(mapBuilt)LMAP.setView([r.la,r.lo],16);};
  if(hasGps){fetch('https://api.open-meteo.com/v1/elevation?latitude='+r.la+'&longitude='+r.lo).then(x=>x.json())
    .then(j=>{const el=$('rm-elev');if(el)el.textContent=(j&&j.elevation&&j.elevation[0]!=null)?(Math.round(j.elevation[0])+' m'):'unavailable';})
    .catch(()=>{const el=$('rm-elev');if(el)el.textContent='unavailable';});}
}
function closeRoute(){$('route-modal').classList.remove('on');$('route-modal').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeRoute();});

/* ===================== EXPLORE (rendered into #explore-section) ===================== */

function fillRoutes(){
  const q=EX.q.toLowerCase();

  const k=EX.sort;rows.sort((a,b)=>{let x=k==='g'?a.gs:a[k],y=k==='g'?b.gs:b[k];x=x==null?'':x;y=y==null?'':y;return (x>y?1:x<y?-1:0)*EX.dir;});

/* ===================== CONTRIBUTE ===================== */
const PROV=[['personally_verified','I verified this myself'],['local_expert','Confirmed by a local expert'],
  ['published_source','From a published source'],['estimated','Estimated'],['unconfirmed','Unconfirmed']];
function loadDraft(id){try{return JSON.parse(localStorage.getItem('vm-draft-'+id))||{}}catch(e){return{}}}
function saveDraft(id,d){try{localStorage.setItem('vm-draft-'+id,JSON.stringify(d))}catch(e){}}
function progressOf(m){const d=loadDraft(m.id);if(!m.checklist.length)return (d.files&&d.files.length)?100:0;
  return Math.round(m.checklist.filter(i=>d.checked&&d.checked[i.id]).length/m.checklist.length*100);}
let CUR=null;
function renderContribute(){ CUR?detail(MISSIONS.find(m=>m.id===CUR)):dashboard(); }
function dashboard(){
  const order={urgent:0,high:1,medium:2,low:3};const list=[...MISSIONS].sort((a,b)=>order[a.priority]-order[b.priority]);
  $('view-contribute').innerHTML=`<div class="wrap">
    <div class="section-head"><div><div class="eyebrow">Your tasks</div><h1 style="font-size:clamp(28px,5vw,46px)">What needs doing</h1></div><span class="pill">${list.length} tasks</span></div>
    <div class="mgrid">${list.map(m=>{const p=progressOf(m);return `<article class="card mission">
      <div class="top"><span class="eyebrow">${esc(m.typeLabel)}</span><span class="prio ${m.priority}">${m.priority}</span></div>
      <h3>${esc(m.title)}</h3><p class="muted" style="margin:2px 0">${esc(m.location)}</p>
      <ul class="needs">${m.needs.slice(0,2).map(n=>`<li>${esc(n)}</li>`).join('')}${m.needs.length>2?`<li class="muted">+${m.needs.length-2} more</li>`:''}</ul>
      <div class="progress"><i style="width:${p}%"></i></div>
      <div class="mfoot"><small class="muted">${p}% ready</small><button class="btn btn-terra" data-open="${m.id}">Open task</button></div></article>`;}).join('')}</div></div>`;
  $('view-contribute').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{CUR=b.dataset.open;renderContribute();});
}
function detail(m){
  let d=loadDraft(m.id);d.checked=d.checked||{};d.notes=d.notes||{};d.files=d.files||[];d.general=d.general||'';
  d.confidence=d.confidence||3;d.prov=d.prov||'unconfirmed';d.safety=!!d.safety;
  const sess={};
  const ctx=[m.ctx.crag,m.ctx.wall,m.ctx.guidebook&&(m.ctx.guidebook+(m.ctx.pages?' · pp. '+m.ctx.pages:'')),m.ctx.coord].filter(Boolean);
  const reqLeft=()=>m.checklist.filter(i=>i.required&&!d.checked[i.id]).length;
  const prog=()=>!m.checklist.length?(d.files.length?100:0):Math.round(m.checklist.filter(i=>d.checked[i.id]).length/m.checklist.length*100);
  function paint(){
    if(d.submitted){$('view-contribute').innerHTML=`<div class="wrap"><div class="card done">
      <div class="eyebrow">Submitted for review</div><h1>Thanks — ${esc(m.title)} is in.</h1>

      $('back2').onclick=()=>{CUR=null;renderContribute();};return;}
    $('view-contribute').innerHTML=`<div class="wrap">
      <button class="btn btn-ghost" id="back">← Tasks</button>
      <div class="section-head" style="margin-top:14px"><div><div class="eyebrow">${esc(m.code)}</div>
        <h1 style="font-size:clamp(26px,4vw,40px)">${esc(m.title)}</h1><p class="muted">${esc(m.location)}</p></div><span class="pill">${prog()}% ready</span></div>
      <div class="progress"><i style="width:${prog()}%"></i></div>
      <div class="card brief"><p>${esc(m.objective)}</p><div class="chipline">${ctx.map(c=>`<span class="pill">${esc(c)}</span>`).join('')}</div>
        <div class="eyebrow">What's needed</div><ul class="needs2">${m.needs.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>
      <div class="blockh"><h2 style="font-size:20px">Confirm as you go</h2></div>
      <div class="checklist">${m.checklist.map(i=>`<label class="check"><input type="checkbox" data-c="${i.id}" ${d.checked[i.id]?'checked':''}>
        <div class="body"><strong>${esc(i.title)}${i.required?'<span class="req"> *</span>':''}</strong><br><small class="muted">${esc(i.help)}</small>
        ${i.evidence==='note'?`<textarea data-note="${i.id}" placeholder="Type your note…">${esc(d.notes[i.id]||'')}</textarea>`:''}</div>
        <span class="pill">${i.evidence==='none'?'confirm':i.evidence}</span></label>`).join('')}</div>
      <div class="blockh"><h2 style="font-size:20px">Add your evidence</h2></div>
      <div class="card evi"><label class="drop" id="drop"><strong>Drop photos, GPX or PDFs here</strong>

        <div class="field"><span class="flabel">Where does this come from?</span><select class="sel" id="prov">${PROV.map(([v,l])=>`<option value="${v}" ${d.prov===v?'selected':''}>${l}</option>`).join('')}</select></div>

    $('back').onclick=()=>{CUR=null;renderContribute();};

    $('view-contribute').querySelectorAll('[data-c]').forEach(cb=>cb.onchange=()=>{d.checked[cb.dataset.c]=cb.checked;persist();paint();});
    $('view-contribute').querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{d.notes[t.dataset.note]=t.value;saveDraft(m.id,d);});

    const drop=$('drop'),fin=$('fin');drop.onclick=()=>fin.click();
    drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();addFiles(e.dataTransfer.files);};

    $('submit').onclick=()=>{d.submitted=true;saveDraft(m.id,d);paint();};
    drawFiles();
    function addFiles(list){[...list].forEach(f=>{const id=Date.now()+'-'+Math.random().toString(36).slice(2,7);
      const kind=/\.gpx$/i.test(f.name)?'gpx':/\.pdf$/i.test(f.name)?'pdf':f.type.startsWith('image/')?'photo':'file';
      if(kind==='photo')sess[id]=URL.createObjectURL(f);d.files.push({id,name:f.name,size:f.size,kind,cap:''});});saveDraft(m.id,d);drawFiles();}
    function drawFiles(){const w=$('files');if(!w)return;
      w.innerHTML=d.files.map(f=>`<div class="file">${sess[f.id]?`<img src="${sess[f.id]}" alt="">`:`<div class="ic">${f.kind==='gpx'?'GPX':f.kind==='pdf'?'PDF':f.kind==='photo'?'IMG':'FILE'}</div>`}
        <div class="fm"><div class="fn" title="${esc(f.name)}">${esc(f.name)}</div><input class="cap" data-cap="${f.id}" placeholder="Caption…" value="${esc(f.cap)}"></div>
        <button class="rm" data-rm="${f.id}" aria-label="Remove">×</button></div>`).join('');
      w.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{d.files=d.files.filter(x=>x.id!==b.dataset.rm);saveDraft(m.id,d);drawFiles();});
      w.querySelectorAll('[data-cap]').forEach(i=>i.oninput=()=>{const f=d.files.find(x=>x.id===i.dataset.cap);if(f){f.cap=i.value;saveDraft(m.id,d);}});}
  }
  paint();
}

/* init */
renderExplore(); renderContribute(); show('browse');
</script>
</body>
</html>
